name: Build iOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build (simulateur, sans signature)
        run: |
          set -o pipefail
          xcodebuild -project Sante.xcodeproj -target Sante \
            -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Test API Open Food Facts
        run: |
          xcrun swiftc -o offcheck Sante/Models/FoodDatabase.swift Sante/Services/OpenFoodFacts.swift Tools/OFFCheck/main.swift
          ./offcheck
