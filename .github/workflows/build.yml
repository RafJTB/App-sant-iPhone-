name: Build iOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build (simulateur, sans signature)
        run: |
          set -o pipefail
          xcodebuild -project Sante.xcodeproj -target Sante \
            -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Test API Open Food Facts
        run: |
          xcrun swiftc -o offcheck Sante/Models/FoodDatabase.swift Sante/Services/OpenFoodFacts.swift Tools/OFFCheck/main.swift
          ./offcheck
      - name: IPA non signée (pour Sideloadly / AltStore)
        run: |
          set -o pipefail
          xcodebuild -project Sante.xcodeproj -target Sante -sdk iphoneos -configuration Release \
            CODE_SIGNING_ALLOWED=NO SYMROOT="$RUNNER_TEMP/build" build | grep -E "error:|BUILD" || true
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/build/Release-iphoneos/Sante.app" Payload/
          # signature ad hoc pour embarquer l'autorisation HealthKit ; l'outil de sideload re-signe ensuite
          codesign --force --sign - --entitlements Sante/Sante.entitlements Payload/Sante.app
          zip -qr Sante-non-signee.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Sante-ipa-non-signee
          path: Sante-non-signee.ipa
          retention-days: 30
