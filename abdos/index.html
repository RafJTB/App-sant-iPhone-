<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Coach Abdos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Coach quotidien pour des abdos visibles : repas, programme de musculation sur 4 semaines, suivi et rappels. Fonctionne hors ligne.">
<meta name="theme-color" content="#0E1014">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Abdos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E1014'/%3E%3Cg fill='%236F8CF6'%3E%3Crect x='17' y='12' width='13' height='11' rx='4'/%3E%3Crect x='34' y='12' width='13' height='11' rx='4'/%3E%3Crect x='17' y='27' width='13' height='11' rx='4'/%3E%3Crect x='34' y='27' width='13' height='11' rx='4'/%3E%3Crect x='18' y='42' width='12' height='11' rx='4'/%3E%3Crect x='34' y='42' width='12' height='11' rx='4'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* Layout : une colonne mobile (max 520 px), cartes graphite, chiffres en SF Rounded,
   barre d'onglets flottante translucide. Thème sombre unique (demande explicite). */
:root {
  color-scheme: dark;
  /* Neutres graphite légèrement bleutés */
  --bg: #0E1014;
  --surface: #171A20;
  --surface-2: #1F232B;
  --surface-3: #2A2F39;
  --line: rgba(214, 224, 255, .07);
  --line-strong: rgba(214, 224, 255, .14);
  --fg: #EEF1F6;
  --fg-2: #BAC1CD;
  --muted: #868E9C;
  --bar-bg: rgba(14, 16, 20, .84);
  --scrim: rgba(4, 5, 8, .62);
  /* Couleurs de données (validées sur fond sombre, toujours accompagnées d'un libellé) */
  --accent: #6F8CF6;      /* protéines + actions principales */
  --accent-ink: #0A0E1C;
  --accent-soft: rgba(111, 140, 246, .15);
  --kcal: #C98322;
  --water: #1FA6B8;
  --sleep: #A779E6;
  --steps: #3AAE6C;
  /* États */
  --good: #3AAE6C;
  --warn: #D9A13B;
  --bad: #E5675F;
  /* Typo */
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  /* Formes & mouvement */
  --r-lg: 22px;
  --r-md: 16px;
  --r-sm: 12px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --tab-h: 68px;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
}
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
img { max-width: 100%; }

.app {
  max-width: 520px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 4px calc(var(--tab-h) + 32px + env(safe-area-inset-bottom, 0px));
}
.view { display: grid; gap: 14px; }
.view.enter { animation: viewIn .34s var(--ease) both; }
@keyframes viewIn { from { opacity: .001; transform: translateY(10px); } }

/* ---------- Typographie ---------- */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-block: 14px 4px; }
.top h1 { font-size: 31px; line-height: 1.08; font-weight: 750; letter-spacing: -.025em; }
.eyebrow { font-size: 12px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.h2 { font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
.h3 { font-size: 16.5px; font-weight: 650; letter-spacing: -.005em; }
.muted { color: var(--muted); }
.fg2 { color: var(--fg-2); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 10px 2px 0; }
.section-title .h2 { font-size: 17px; }

/* ---------- Surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.card.tight { gap: 10px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; }
.card-head > div { min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.divider { height: 1px; background: var(--line); }

/* ---------- Boutons ---------- */
.btn {
  min-height: 52px; padding: 0 18px; border-radius: var(--r-md);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--fg);
  font-weight: 650; font-size: 15.5px; text-decoration: none; white-space: nowrap;
  transition: transform .16s var(--ease), background-color .2s, color .2s, border-color .2s;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.btn-ghost { background: transparent; border-color: var(--line-strong); }
.btn-danger { background: rgba(229, 103, 95, .12); border-color: rgba(229, 103, 95, .35); color: var(--bad); }
.btn-sm { min-height: 42px; padding: 0 14px; font-size: 14px; border-radius: 13px; }
.btn-block { width: 100%; }
.icon-btn {
  width: 46px; height: 46px; flex: none; border-radius: 14px; display: grid; place-items: center;
  background: var(--surface); border: 1px solid var(--line); color: var(--fg-2);
  transition: transform .16s var(--ease);
}
.icon-btn:active { transform: scale(.94); }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic-sm { width: 18px; height: 18px; }
.ic-fill { fill: currentColor; stroke: none; }

/* ---------- Puces ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 99px;
  background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--fg-2); white-space: nowrap;
}
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--muted)); }
.chip-accent { background: var(--accent-soft); border-color: transparent; color: var(--fg); }
.pill { display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border-radius: 9px; background: var(--surface-2); font-size: 13px; font-weight: 600; color: var(--fg-2); white-space: nowrap; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 650; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.status.good { color: var(--good); } .status.warn { color: var(--warn); } .status.bad { color: var(--bad); } .status.info { color: var(--accent); }

/* ---------- Jauges ---------- */
.meter { display: grid; gap: 8px; }
.meter-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.meter-label { display: inline-flex; align-items: center; gap: 8px; font-weight: 650; color: var(--fg-2); font-size: 14px; }
.meter-label .ic { color: var(--c); }
.meter-val { font-size: 14px; color: var(--muted); white-space: nowrap; }
.meter-val b { font-family: var(--font-num); font-size: 26px; font-weight: 700; color: var(--fg); letter-spacing: -.02em; }
.track { position: relative; height: 10px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.track i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--c); transform-origin: left center; }
.enter .track i { animation: grow .9s var(--ease) both; }
@keyframes grow { from { transform: scaleX(0); } }
.track .tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--surface); }
.meter-foot { font-size: 13px; color: var(--muted); }

/* ---------- Aujourd'hui ---------- */
.hero { gap: 18px; }
.next-meal { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; }
.time-badge { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 18px; background: var(--surface-2); border: 1px solid var(--line); }
.time-badge b { font-family: var(--font-num); font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
.time-badge span { font-size: 11px; color: var(--muted); margin-top: -6px; }
.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.quick-tile {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 12px;
  display: grid; gap: 6px; text-decoration: none; min-width: 0; position: relative;
}
.quick-tile .ic { color: var(--c); }
.quick-tile b { font-family: var(--font-num); font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
.quick-tile small { font-size: 12px; color: var(--muted); }
.quick-tile .mini { height: 4px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.quick-tile .mini i { display: block; height: 100%; background: var(--c); border-radius: inherit; }
.tip-card { background: linear-gradient(180deg, var(--surface-2), var(--surface)); }
.tip-card p { color: var(--fg-2); }

/* ---------- Repas ---------- */
.date-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.date-nav .label { text-align: center; font-weight: 650; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 15px; padding: 4px; gap: 4px; }
.seg button { min-height: 44px; border-radius: 11px; font-weight: 650; font-size: 14.5px; color: var(--muted); transition: background-color .2s, color .2s; }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--fg); }
.meal { position: relative; }
.meal-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.meal-time { display: inline-flex; align-items: baseline; gap: 8px; }
.meal-time b { font-family: var(--font-num); font-size: 17px; font-weight: 700; }
.meal-time span { color: var(--muted); font-size: 13.5px; font-weight: 600; }
.meal h3 { font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
.ingr { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13.5px; color: var(--fg-2); }
.ingr li { display: flex; justify-content: space-between; gap: 12px; }
.ingr li span:last-child { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.macros { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.macros b { color: var(--fg); font-family: var(--font-num); font-size: 15px; }
.macros .k b { color: var(--fg); }
.tip { font-size: 13px; color: var(--muted); border-left: 2px solid var(--line-strong); padding-left: 10px; }
.meal.is-done { background: var(--surface); }
.meal.is-done h3, .meal.is-done .ingr { opacity: .55; }
.meal.is-due { border-color: rgba(201, 131, 34, .55); }
.due-badge { font-size: 12px; font-weight: 700; color: var(--kcal); display: inline-flex; align-items: center; gap: 6px; }
.due-badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--kcal); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.btn-check[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.pop { animation: pop .42s var(--ease); }
@keyframes pop { 30% { transform: scale(.96); } 60% { transform: scale(1.02); } }
.totals { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.extras { display: grid; gap: 8px; }
.extra { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 13px; background: var(--surface-2); font-size: 14px; }
.extra span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shop { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.shop li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.shop li:last-child { border-bottom: 0; }
.shop li span:last-child { color: var(--fg-2); font-variant-numeric: tabular-nums; white-space: nowrap; }

details > summary { list-style: none; cursor: pointer; }
details > summary::-webkit-details-marker { display: none; }
.disclosure { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 30px; font-weight: 650; }
.disclosure .ic { transition: transform .25s var(--ease); color: var(--muted); }
details[open] > summary .ic { transform: rotate(90deg); }

/* ---------- Entraînement ---------- */
.weeks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.week { border-radius: 13px; padding: 10px 6px; text-align: center; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 2px; }
.week b { font-family: var(--font-num); font-size: 16px; }
.week span { font-size: 11px; color: var(--muted); font-weight: 600; }
.week.is-current { background: var(--accent-soft); border-color: rgba(111, 140, 246, .45); }
.week.is-current span { color: var(--fg-2); }
.week.is-past b { color: var(--muted); }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.dayc {
  display: grid; gap: 3px; justify-items: center; padding: 9px 2px; border-radius: 13px;
  background: var(--surface); border: 1px solid var(--line); min-height: 74px; font-size: 11px; color: var(--muted);
}
.dayc b { font-family: var(--font-num); font-size: 16px; color: var(--fg); }
.dayc em { font-style: normal; font-weight: 650; color: var(--fg-2); font-size: 10.5px; line-height: 1.1; text-align: center; }
.dayc.has-session em { color: var(--accent); }
.dayc.is-selected { border-color: var(--accent); background: var(--surface-2); }
.dayc.is-today b { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 4px; text-decoration-thickness: 2px; }
.dayc .done-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); }
.ex { gap: 12px; }
.ex-head { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; }
.ex-n { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); font-family: var(--font-num); font-weight: 700; font-size: 15px; color: var(--fg-2); }
.ex-abs .ex-n { background: var(--accent-soft); color: var(--accent); }
.ex-meta { display: flex; flex-wrap: wrap; gap: 6px; }
.ex-note { font-size: 13.5px; color: var(--fg-2); }
.ex-last { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.ex-last b { color: var(--fg); }
.cues { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13.5px; color: var(--fg-2); }
.sets { display: grid; gap: 8px; }
.set-row { display: grid; grid-template-columns: 30px 1fr 1fr 52px; gap: 8px; align-items: center; }
.set-row.head { font-size: 11.5px; color: var(--muted); font-weight: 650; letter-spacing: .03em; text-transform: uppercase; }
.set-n { font-family: var(--font-num); font-weight: 700; color: var(--muted); text-align: center; }
.field {
  width: 100%; min-width: 0; height: 50px; border-radius: 13px; border: 1px solid var(--line-strong); background: var(--surface-2);
  padding: 0 12px; font-size: 17px; font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--fg);
  -webkit-appearance: none; appearance: none;
}
.field::placeholder { color: var(--muted); opacity: .75; }
.field:focus { outline: none; border-color: var(--accent); }
.field:disabled { opacity: .5; }
select.field { font-family: var(--font); font-size: 16px; }
.set-check { width: 52px; height: 50px; border-radius: 13px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line-strong); color: var(--muted); transition: background-color .2s, color .2s, transform .16s var(--ease); }
.set-check:active { transform: scale(.92); }
.set-row.is-done .set-check { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.set-row.is-done .field { border-color: transparent; }
.abs-sep { display: flex; align-items: center; gap: 10px; padding: 8px 2px 0; }
.abs-sep::after { content: ""; flex: 1; height: 1px; background: var(--line-strong); }
.prog-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.prog-table th, .prog-table td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.prog-table th { color: var(--muted); font-weight: 650; font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; }
.prog-table td:first-child { white-space: normal; min-width: 130px; color: var(--fg-2); }
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-inline: -4px; padding-inline: 4px; }

/* ---------- Suivi ---------- */
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.kpi { background: var(--surface-2); border-radius: 14px; padding: 12px; display: grid; gap: 2px; min-width: 0; }
.kpi small { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.kpi b { font-family: var(--font-num); font-size: 20px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
.kpi span { font-size: 12px; color: var(--muted); }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.chart .axis { fill: var(--muted); font-size: 10.5px; font-family: var(--font); }
.chart .grid { stroke: var(--line-strong); stroke-width: 1; }
.chart .raw { fill: var(--fg-2); opacity: .38; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .pt { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .last-label { fill: var(--fg); font-size: 12px; font-weight: 700; font-family: var(--font-num); }
.chart .xhair { stroke: var(--fg-2); stroke-width: 1; stroke-dasharray: 3 3; }
.chart-tip { position: absolute; top: -10px; transform: translateX(-50%); background: var(--surface-3); border: 1px solid var(--line-strong); border-radius: 10px; padding: 6px 10px; font-size: 12.5px; white-space: nowrap; pointer-events: none; }
.chart-tip b { font-family: var(--font-num); }
.chart-empty { height: 170px; border: 1px dashed var(--line-strong); border-radius: 16px; display: grid; place-items: center; text-align: center; padding: 16px; color: var(--muted); font-size: 14px; }
.wk-list { display: grid; }
.wk { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.wk:last-child { border-bottom: 0; }
.wk b { font-family: var(--font-num); }
.delta { font-family: var(--font-num); font-size: 13px; font-weight: 650; min-width: 58px; text-align: right; }
.delta.up { color: var(--fg-2); } .delta.down { color: var(--fg-2); }
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.photo { position: relative; aspect-ratio: 3 / 4; max-width: 100%; border-radius: 13px; overflow: hidden; background: var(--surface-2); }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo span { position: absolute; left: 6px; bottom: 6px; font-size: 11px; font-weight: 650; background: rgba(0, 0, 0, .55); color: #fff; padding: 2px 7px; border-radius: 7px; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-grid label, .lab { display: grid; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; min-width: 0; }
.coach { display: grid; gap: 8px; }

/* ---------- Rappels ---------- */
.big-num { font-family: var(--font-num); font-size: 40px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.big-num small { font-size: 16px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
.glasses { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
.glass { aspect-ratio: 2 / 3; max-width: 100%; border-radius: 6px 6px 9px 9px; border: 1.5px solid var(--line-strong); position: relative; overflow: hidden; }
.glass.full { border-color: transparent; background: var(--water); }
.stepper { display: grid; grid-template-columns: 56px 1fr 56px; gap: 10px; align-items: center; }
.stepper .btn { padding: 0; }
.stepper .val { text-align: center; }
.minibars { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 92px; padding-bottom: 18px; }
.minibars .goal { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line-strong); }
.mb { height: 100%; display: grid; grid-template-rows: 1fr auto; gap: 4px; justify-items: center; position: relative; }
.mb-track { width: 100%; max-width: 26px; height: 100%; display: flex; align-items: flex-end; }
.mb-track i { display: block; width: 100%; border-radius: 4px 4px 0 0; background: var(--c); }
.mb-l { position: absolute; bottom: -18px; font-size: 11px; color: var(--muted); font-weight: 600; }
.mb.is-today .mb-l { color: var(--fg); }

/* ---------- Réglages ---------- */
.field-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 54px; border-bottom: 1px solid var(--line); }
.field-row:last-child { border-bottom: 0; }
.field-row > span:first-child { font-size: 15px; color: var(--fg-2); min-width: 0; }
.field-wrap { display: inline-flex; align-items: center; gap: 8px; flex: none; }
.field-wrap .field { width: 108px; height: 44px; text-align: right; font-size: 16px; }
.field-wrap input[type="time"], .field-wrap input[type="date"] { width: auto; min-width: 108px; }
.field-wrap em { font-style: normal; color: var(--muted); font-size: 13px; min-width: 34px; }
.list { display: grid; }
.daypick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.daypick button { height: 48px; border-radius: 13px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 700; color: var(--muted); }
.daypick button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.switch { width: 52px; height: 32px; border-radius: 99px; background: var(--surface-3); position: relative; flex: none; transition: background-color .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--fg); transition: transform .25s var(--ease); }
.switch[aria-pressed="true"] { background: var(--accent); }
.switch[aria-pressed="true"]::after { transform: translateX(20px); }
.note { font-size: 13px; color: var(--muted); }

/* ---------- Couches flottantes ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  padding: 6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  background: var(--bar-bg); -webkit-backdrop-filter: saturate(170%) blur(20px); backdrop-filter: saturate(170%) blur(20px);
  border-top: 1px solid var(--line);
}
.tabs { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { display: grid; justify-items: center; gap: 2px; padding: 6px 0 4px; min-height: 56px; text-decoration: none; color: var(--muted); font-size: 11px; font-weight: 650; }
.tab .ic-wrap { width: 46px; height: 30px; border-radius: 99px; display: grid; place-items: center; transition: background-color .25s; }
.tab[aria-current="page"] { color: var(--fg); }
.tab[aria-current="page"] .ic-wrap { background: var(--accent-soft); color: var(--accent); }

.banner {
  position: fixed; z-index: 60; top: calc(env(safe-area-inset-top, 0px) + 8px);
  left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
  max-width: 500px; margin: 0 auto; animation: drop .45s var(--ease) both;
}
@keyframes drop { from { transform: translateY(-120%); opacity: 0; } }
.banner-card {
  background: var(--surface-3); border: 1px solid var(--line-strong); border-radius: 20px; padding: 14px;
  display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
  box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
}
.banner-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--c); }
.banner-card b { display: block; font-size: 15px; }
.banner-card p { font-size: 13px; color: var(--fg-2); }
.banner-actions { grid-column: 1 / -1; display: flex; gap: 8px; }
.banner-actions .btn { flex: 1; }

.timer {
  position: fixed; z-index: 50; left: 0; right: 0;
  bottom: calc(var(--tab-h) + 12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.timer-card {
  pointer-events: auto; max-width: 496px; margin: 0 auto; border-radius: 22px; padding: 10px 10px 10px 12px;
  background: var(--surface-3); border: 1px solid var(--line-strong); box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
  display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: center; animation: rise .35s var(--ease) both;
}
@keyframes rise { from { transform: translateY(30px); opacity: 0; } }
.ring { width: 48px; height: 48px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 4; }
.ring .bg { stroke: var(--surface); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.timer-card b { font-family: var(--font-num); font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
.timer-card p { font-size: 12.5px; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.timer.done .timer-card { border-color: var(--good); }
.timer.done .ring .fg { stroke: var(--good); }

.sheet-root { position: fixed; inset: 0; z-index: 70; pointer-events: none; }
.sheet-root.open { pointer-events: auto; }
.scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity .25s; }
.sheet-root.open .scrim { opacity: 1; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto;
  max-height: 88vh; max-height: 88dvh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border: 1px solid var(--line-strong); border-bottom: 0; border-radius: 26px 26px 0 0;
  padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  transform: translateY(105%); transition: transform .34s var(--ease);
  display: grid; gap: 14px;
}
.sheet-root.open .sheet { transform: none; }
.grab { width: 40px; height: 5px; border-radius: 99px; background: var(--surface-3); margin: 0 auto 4px; }
.opt { text-align: left; width: 100%; padding: 14px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line); display: grid; gap: 6px; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt .macros { font-size: 12.5px; }
.sheet img.full { width: 100%; border-radius: 16px; display: block; }

.toast {
  position: fixed; z-index: 80; left: 50%; bottom: calc(var(--tab-h) + 20px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%); max-width: calc(100% - 32px);
  background: var(--fg); color: var(--bg); padding: 11px 16px; border-radius: 14px; font-size: 14px; font-weight: 650;

}

body.has-timer .toast { bottom: calc(var(--tab-h) + 96px + env(safe-area-inset-bottom, 0px)); }

@media (max-width: 370px) {
  .top h1 { font-size: 27px; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .quick { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .quick-tile b { font-size: 18px; }
  .set-row { grid-template-columns: 24px 1fr 1fr 48px; gap: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

const STORAGE_KEY = 'coach-abdos.v1';
const SNOOZE_KEY = 'coach-abdos.snooze';

function freshState() {
  return { v: 1, settings: JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), days: {}, workouts: {}, body: [] };
}

/** Fusionne les réglages enregistrés avec les valeurs par défaut (nouvelles options après une mise à jour). */
function migrate(s) {
  const base = freshState();
  const out = { ...base, ...s };
  out.settings = { ...base.settings, ...(s.settings || {}) };
  out.settings.mealTimes = { ...base.settings.mealTimes, ...(s.settings?.mealTimes || {}) };
  out.settings.mealDefaults = { training: {}, rest: {}, ...(s.settings?.mealDefaults || {}) };
  out.days = s.days || {};
  out.workouts = s.workouts || {};
  out.body = Array.isArray(s.body) ? s.body : [];
  return out;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return migrate(JSON.parse(raw));
  } catch (e) { /* stockage indisponible : on démarre à vide */ }
  return freshState();
}

let storageWarned = false;
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { if (!storageWarned) { storageWarned = true; toast('Stockage indisponible : tes données ne seront pas conservées.'); } }
}

function loadSnooze() {
  try { const o = JSON.parse(localStorage.getItem(SNOOZE_KEY) || '{}'); const now = Date.now(); for (const k in o) if (o[k] < now) delete o[k]; return o; }
  catch (e) { return {}; }
}
function saveSnooze() { try { localStorage.setItem(SNOOZE_KEY, JSON.stringify(ui.snooze)); } catch (e) { /* ignore */ } }

/** Photos : stockées dans IndexedDB, sur le téléphone uniquement. */
const PhotoDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) return reject(new Error('IndexedDB indisponible'));
      const req = indexedDB.open('coach-abdos-photos', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('photos', { keyPath: 'id' });
      req.onsuccess = () => { this.db = req.result; resolve(this.db); };
      req.onerror = () => reject(req.error);
    });
  },
  async run(mode, fn) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('photos', mode);
      const req = fn(tx.objectStore('photos'));
      tx.oncomplete = () => resolve(req ? req.result : undefined);
      tx.onerror = () => reject(tx.error);
    });
  },
  all() { return this.run('readonly', s => s.getAll()); },
  put(p) { return this.run('readwrite', s => s.put(p)); },
  del(id) { return this.run('readwrite', s => s.delete(id)); },
  clear() { return this.run('readwrite', s => s.clear()); },
};

function mealMacros(id) {
  if (macroCache[id]) return macroCache[id];
  const m = MEALS[id]; const t = { kcal: 0, p: 0, g: 0, l: 0 };
  if (!m) return t;
  for (const [f, g] of m.items) { const F = FOODS[f]; if (!F) continue; t.kcal += F.kcal * g / 100; t.p += F.p * g / 100; t.g += F.g * g / 100; t.l += F.l * g / 100; }
  return (macroCache[id] = t);
}

function dayType(k) {
  const o = state.days[k]?.type;
  if (o === 'training' || o === 'rest') return o;
  return sessionFor(k) ? 'training' : 'rest';
}
const kcalGoal = k => dayType(k) === 'training' ? S().kcalTraining : S().kcalRest;

/** Créneaux de la journée avec le repas choisi (choix du jour > choix par défaut > 1re option). */
function plannedSlots(k) {
  const type = dayType(k); const d = peekDay(k); const st = S();
  return MEAL_PLANS[type].slots.map(s => {
    const saved = d.meals?.[s.slot];
    const def = st.mealDefaults?.[type]?.[s.slot];
    let mealId = s.options[0];
    if (saved?.opt && (saved.done || s.options.includes(saved.opt)) && MEALS[saved.opt]) mealId = saved.opt;
    else if (def && s.options.includes(def)) mealId = def;
    return { ...s, label: s.label || MEAL_SLOTS[s.slot].name, time: st.mealTimes[s.slot] || MEAL_SLOTS[s.slot].time, mealId, done: !!saved?.done };
  }).sort((a, b) => toMin(a.time) - toMin(b.time));
}

function consumed(k) {
  const d = peekDay(k); const t = { kcal: 0, p: 0 };
  for (const m of Object.values(d.meals || {})) if (m.done && MEALS[m.opt]) { const x = mealMacros(m.opt); t.kcal += x.kcal; t.p += x.p; }
  for (const x of d.extras || []) { t.kcal += +x.kcal || 0; t.p += +x.p || 0; }
  return t;
}

function planned(k) {
  const t = { kcal: 0, p: 0, g: 0, l: 0 };
  for (const s of plannedSlots(k)) { const x = mealMacros(s.mealId); t.kcal += x.kcal; t.p += x.p; t.g += x.g; t.l += x.l; }
  return t;
}

function nextMeal(k) {
  const pending = plannedSlots(k).filter(s => !s.done);
  if (!pending.length) return null;
  const now = nowMin();
  return pending.find(s => toMin(s.time) + 60 >= now) || pending[pending.length - 1];
}

/* ---------- Programme ---------- */
const isTrainingWeekday = k => S().trainingDays.includes(weekday(k));

/** Lundi de la semaine du prochain jour d'entraînement (aujourd'hui compris). */
function firstProgramMonday() {
  let k = todayKey();
  for (let i = 0; i < 7 && !isTrainingWeekday(k); i++) k = addDays(k, 1);
  return mondayOf(k);
}
function ensureProgramStart() {
  if (S().programStart) return;
  state.settings.programStart = firstProgramMonday();
  save();
}

function programInfo(k) {
  const start = S().programStart;
  const n = diffDays(start, k);
  if (n < 0) return { started: false };
  const wi = Math.floor(n / 7);
  return { started: true, week: wi % 4, cycle: Math.floor(wi / 4) + 1 };
}

/** Séance prévue à la date k (ou null). Les séances tournent dans l'ordre ROTATION sur les jours cochés. */
function sessionFor(k) {
  const logged = state.workouts[k];
  if (logged?.session && SESSIONS[logged.session]) return { id: logged.session, week: logged.week, cycle: logged.cycle, started: true };
  const info = programInfo(k);
  if (!info.started || !isTrainingWeekday(k)) return null;
  const start = S().programStart; const n = diffDays(start, k);
  const full = Math.floor(n / 7);
  let count = full * S().trainingDays.length;
  for (let i = full * 7; i < n; i++) if (isTrainingWeekday(addDays(start, i))) count++;
  return { id: ROTATION[count % ROTATION.length], ...info };
}

function nextSessionFrom(k, includeSelf = true) {
  for (let i = includeSelf ? 0 : 1; i < 21; i++) { const d = addDays(k, i); const s = sessionFor(d); if (s) return { date: d, ...s }; }
  return null;
}

function sessionExercises(id, week) {
  const s = SESSIONS[id]; if (!s) return [];
  const list = s.ex.map(([exId, sch, rest]) => ({ exId, scheme: SCHEMES[sch][week], rest, abs: false }));
  if (s.abs) for (const [exId, sch, rest] of ABS_BLOCKS[s.abs]) list.push({ exId, scheme: SCHEMES[sch][week], rest, abs: true });
  return list;
}

const topReps = r => { const m = String(r).match(/(\d+)(?!.*\d)/); return m ? +m[1] : null; };

function sessionMinutes(id, week) {
  return Math.round((8 * 60 + sum(sessionExercises(id, week).map(e => e.scheme.s * (40 + e.rest)))) / 60 / 5) * 5;
}

function getWorkout(k, sess, create = false) {
  let w = state.workouts[k];
  if (!w && create) {
    w = state.workouts[k] = { session: sess.id, week: sess.week, cycle: sess.cycle, ex: {}, done: false };
  }
  if (w) for (const e of sessionExercises(w.session, w.week)) {
    w.ex[e.exId] ||= [];
    while (w.ex[e.exId].length < e.scheme.s) w.ex[e.exId].push({ kg: '', reps: '', done: false });
  }
  return w;
}

/** Dernières séries réalisées d'un exercice avant la date k. skipDeload : ignore les semaines de décharge. */
function lastPerf(exId, before, skipDeload = false) {
  const keys = Object.keys(state.workouts).filter(k => k < before).sort().reverse();
  for (const k of keys) {
    const w = state.workouts[k];
    if (skipDeload && w.week === 3) continue;
    const sets = (w.ex?.[exId] || []).filter(s => s.done);
    if (sets.length) {
      const sch = sessionExercises(w.session, w.week).find(e => e.exId === exId)?.scheme;
      return { date: k, week: w.week, sets, scheme: sch };
    }
  }
  return null;
}

/** Charge conseillée (double progression) : toutes les reps visées réussies → on monte d'un palier. */
function suggestion(exId, scheme, k) {
  const E = EXERCISES[exId];
  const last = lastPerf(exId, k, true);
  const kgs = last ? last.sets.map(s => parseNum(s.kg)).filter(v => v !== null) : [];
  const kg = kgs.length ? (E.assist ? Math.min(...kgs) : Math.max(...kgs)) : null;
  // Abdos à progression par variante (relevés, roue) ou par durée (planche) : la consigne de la semaine suffit.
  if (E.inc === 0 || E.reps === 'Secondes') return { kg, text: '' };
  if (kg === null) return { kg: null, text: last ? 'Note ta charge pour obtenir une suggestion.' : 'Première fois : choisis une charge qui laisse la réserve indiquée.' };
  const target = topReps(last.scheme?.r) || 0;
  const minSets = last.scheme?.s || 1;
  const hit = last.sets.length >= minSets && last.sets.every(s => (parseNum(s.reps) ?? 0) >= target);
  if (E.assist) {
    if (scheme.deload) { const v = kg + 5; return { kg: v, text: `Décharge : assistance ${fmtKg(v)} kg` }; }
    if (hit) { const v = Math.max(0, kg - E.inc); return { kg: v, text: v > 0 ? `Toutes les reps réussies : assistance ${fmtKg(v)} kg` : kg > 0 ? 'Toutes les reps réussies : essaie sans assistance' : 'Sans assistance et toutes les reps : vise 1 rep de plus' }; }
    return { kg, text: `Garde ${fmtKg(kg)} kg d’assistance et vise toutes les reps` };
  }
  if (scheme.deload) { const v = roundTo(kg * 0.9, E.round || 2.5); return { kg: v, text: `Décharge : ${fmtKg(v)} kg (−10 %)` }; }
  if (hit) { const v = kg + E.inc; return { kg: v, text: `Toutes les reps réussies : monte à ${fmtKg(v)} kg` }; }
  return { kg, text: `Garde ${fmtKg(kg)} kg et vise toutes les reps` };
}

/* ---------- Suivi corporel ---------- */
const bodySorted = () => [...state.body].sort((a, b) => a.date < b.date ? -1 : 1);

function weeklyAverages(metric) {
  const groups = new Map();
  for (const e of state.body) {
    if (e[metric] == null) continue;
    const m = mondayOf(e.date);
    if (!groups.has(m)) groups.set(m, []);
    groups.get(m).push(e);
  }
  return [...groups.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1).map(([monday, list]) => ({
    monday, n: list.length,
    avg: sum(list.map(e => +e[metric])) / list.length,
    offset: sum(list.map(e => diffDays(monday, e.date))) / list.length,
  }));
}

/** Pente (unité / semaine) par moindres carrés sur les N derniers jours. */
function trend(metric, days = 28) {
  const t = todayKey();
  const pts = state.body.filter(e => e[metric] != null && diffDays(e.date, t) <= days && diffDays(e.date, t) >= 0);
  if (pts.length < 2) return null;
  const xs = pts.map(e => -diffDays(e.date, t)), ys = pts.map(e => +e[metric]);
  const span = Math.max(...xs) - Math.min(...xs);
  const mx = sum(xs) / xs.length, my = sum(ys) / ys.length;
  const den = sum(xs.map(x => (x - mx) ** 2));
  if (!den) return null;
  const slope = sum(xs.map((x, i) => (x - mx) * (ys[i] - my))) / den;
  return { perWeek: slope * 7, n: pts.length, span };
}

/** Analyse automatique : objectif = ne pas maigrir, prise lente (+0,1 à +0,25 kg/semaine). */
function coachAnalysis() {
  const w = trend('weight');
  if (!w || w.n < 6 || w.span < 10) {
    return { level: 'info', title: 'Analyse dans quelques jours', text: 'Pèse-toi au moins 3 fois par semaine pendant 2 semaines : je pourrai alors te dire si tes calories sont bien réglées.' };
  }
  const v = w.perWeek; const waist = trend('waist');
  const waistUp = waist && waist.n >= 3 && waist.span >= 14 && waist.perWeek > 0.25;
  const pw = `${v >= 0 ? '+' : '−'}${fmt(Math.abs(v), 2)} kg/semaine`;
  if (v < -0.05) return { level: 'bad', title: `Tu perds du poids (${pw})`, text: 'Ton objectif est de ne pas maigrir. Ajoute environ 150 kcal par jour (une banane et une poignée d’amandes, par exemple).', delta: 150 };
  if (v <= 0.08) return { level: 'good', title: `Poids stable (${pw})`, text: waistUp ? 'Ton tour de taille augmente malgré un poids stable : vérifie que tu ne dépasses pas tes calories les jours de repos.' : 'Bien pour une recomposition si tes charges montent et que ta taille reste stable. Si tes charges stagnent 2 semaines, ajoute 100 kcal par jour.', delta: waistUp ? null : 100, deltaLabel: '+100 kcal' };
  if (v <= 0.3) return { level: waistUp ? 'warn' : 'good', title: `Prise lente (${pw})`, text: waistUp ? 'Le rythme est bon mais ton tour de taille monte : retire 100 kcal les jours de repos.' : 'C’est le rythme idéal pour prendre du muscle sans gras. Garde le cap.', delta: waistUp ? -100 : null };
  return { level: 'warn', title: `Ça monte vite (${pw})`, text: 'Au-delà de 0,3 kg par semaine, c’est surtout du gras. Retire environ 150 kcal par jour, en priorité les jours de repos.', delta: -150 };
}

}

function meter({ label, ic, color, value, goal, unit, foot = '', ticks = [] }) {
  const pct = goal ? clamp(value / goal * 100, 0, 100) : 0;
  return `<div class="meter" style="--c:${color}">
    <div class="meter-head"><span class="meter-label">${icon(ic, 'ic-sm')}${label}</span>

    <div class="track" role="progressbar" aria-label="${esc(label)}" aria-valuemin="0" aria-valuemax="${Math.round(goal)}" aria-valuenow="${Math.round(value)}">
      <i style="width:${pct}%"></i>${ticks.map(t => `<span class="tick" style="left:${clamp(t / goal * 100, 0, 100)}%"></span>`).join('')}
    </div>
    ${foot ? `<p class="meter-foot">${foot}</p>` : ''}
  </div>`;
}

function proteinFoot(p) {
  const st = S();
  if (p < st.proteinMin) return `Encore ${fmt(st.proteinMin - p)} g pour entrer dans ta zone (${st.proteinMin}-${st.proteinMax} g)`;
  if (p < st.protein) return `<span class="status good">Zone atteinte</span> · ${fmt(st.protein - p)} g pour l’objectif`;
  return `<span class="status good">Objectif atteint</span>`;
}
function kcalFoot(c, goal) {
  const r = goal - c;
  if (r > 0) return `Reste ${fmt(r)} kcal`;
  if (r > -150) return `<span class="status good">Objectif atteint</span>`;
  return `<span class="status warn">${fmt(-r)} kcal au-dessus</span>`;
}

}

      ${M.tip ? `<p class="tip">${esc(M.tip)}</p>` : ''}

        <button class="btn btn-check" aria-pressed="${s.done}" data-act="meal-toggle" data-date="${k}" data-slot="${s.slot}">${icon('check')}${s.done ? 'Mangé' : 'J’ai mangé'}</button>
        <button class="btn btn-ghost" data-act="meal-replace" data-date="${k}" data-slot="${s.slot}">${icon('swap')}Remplacer</button>
      </div>
    </article>`;
  }).join('');

  const extras = (d.extras || []).map(x => `<div class="extra"><span>${esc(x.name)}</span><span class="muted num">${fmt(x.kcal)} kcal · ${fmt(x.p)} g</span><button class="icon-btn" style="width:38px;height:38px" data-act="extra-del" data-date="${k}" data-id="${x.id}" aria-label="Supprimer ${esc(x.name)}">${icon('trash', 'ic-sm')}</button></div>`).join('');

  return `${header('Repas', MEAL_PLANS[type].label)}

      <button aria-pressed="${type === 'rest'}" data-act="day-type" data-date="${k}" data-type="rest">Repos</button>
    </div>
    ${type !== natural ? `<p class="note">Type de journée modifié manuellement (prévu : ${natural === 'training' ? 'entraînement' : 'repos'}).</p>` : ''}
    <section class="card tight">
      <div class="totals">
        <div><p class="tiny muted">Menu prévu</p><p class="num" style="font-size:20px;font-weight:700">${fmt(plan.kcal)} <span class="small muted">kcal</span></p><p class="small muted">${fmt(plan.p)} g de protéines</p></div>
        <div><p class="tiny muted">Objectif du jour</p><p class="num" style="font-size:20px;font-weight:700">${fmt(goal)} <span class="small muted">kcal</span></p><p class="small muted">${st.proteinMin}-${st.proteinMax} g de protéines</p></div>
      </div>
      ${meter({ label: 'Mangé', ic: 'meal', color: 'var(--kcal)', value: c.kcal, goal, unit: 'kcal' })}
      ${meter({ label: 'Protéines', ic: 'flame', color: 'var(--accent)', value: c.p, goal: st.protein, unit: 'g', ticks: [st.proteinMin] })}
    </section>
    ${cards}
    <section class="card tight">
      <div class="card-head"><h3 class="h3">Extras</h3><button class="btn btn-sm btn-ghost" data-act="extra-open" data-date="${k}">${icon('plus', 'ic-sm')}Ajouter</button></div>
      ${extras ? `<div class="extras">${extras}</div>` : '<p class="note">Un écart, un fruit en plus, un resto ? Ajoute-le ici pour garder des totaux justes.</p>'}
    </section>
    <section class="card tight">
      <details id="d-shop" ${ui.open.has('d-shop') ? 'open' : ''}><summary class="disclosure"><span>Liste de courses · 7 prochains jours</span>${icon('right', 'ic-sm')}</summary>
        <div style="margin-top:10px">${shoppingList()}</div></details>
    </section>
    <p class="note">Valeurs moyennes (table Ciqual), aliments pesés crus sauf mention. Remplacer un repas propose des alternatives aux calories et protéines proches.</p>`;
};

function shoppingList() {
  const totals = {};
  for (let i = 0; i < 7; i++) {
    const k = addDays(todayKey(), i);
    for (const s of plannedSlots(k)) for (const [f, g] of MEALS[s.mealId].items) totals[f] = (totals[f] || 0) + g;
  }
  const rows = Object.entries(totals).sort((a, b) => FOODS[a[0]].n.localeCompare(FOODS[b[0]].n, 'fr')).map(([f, g]) => {
    const F = FOODS[f]; let q;
    if (F.u) { const n = Math.ceil(g / F.u); q = `${n} ${F.un}${n > 1 ? 's' : ''}`; }
    else if (F.liquid) q = `${fmt(g / 1000, 1)} L`;
    else q = g >= 1000 ? `${fmt(g / 1000, 2).replace(/0$/, '')} kg` : `${Math.ceil(g / 10) * 10} g`;
    return `<li><span>${esc(F.n)}</span><span>${q}</span></li>`;
  });
  return `<ul class="shop">${rows.join('')}</ul><p class="note" style="margin-top:8px">Calculée à partir des repas choisis pour chaque jour.</p>`;
}

/* ---------- Entraînement ---------- */
Views.workout = () => {
  const t = todayKey();
  if (!ui.workoutDate) ui.workoutDate = sessionFor(t) ? t : (nextSessionFrom(t)?.date || t);
  const k = ui.workoutDate;
  const sess = sessionFor(k); const info = programInfo(k);
  const monday = mondayOf(k);

  const weekStrip = `<div class="weeks">${WEEKS.map((w, i) => {
    const cur = info.started && info.week === i; const past = info.started && i < info.week;
    return `<div class="week ${cur ? 'is-current' : ''} ${past ? 'is-past' : ''}"><b>S${i + 1}</b><span>${w.label}</span></div>`;
  }).join('')}</div>`;

  const dayStrip = `<div class="days">${Array.from({ length: 7 }, (_, i) => {
    const dk = addDays(monday, i); const s = sessionFor(dk); const done = state.workouts[dk]?.done;
    return `<button class="dayc ${s ? 'has-session' : ''} ${dk === k ? 'is-selected' : ''} ${dk === t ? 'is-today' : ''}" data-act="workout-day" data-date="${dk}" aria-label="${fmtDay(dk)}${s ? ' : ' + SESSIONS[s.id].name : ' : repos'}">
      <span>${DAY_SHORT[weekday(dk)]}</span><b>${dateOf(dk).getDate()}</b><em>${s ? SESSIONS[s.id].short : '—'}</em>${done ? '<span class="done-dot"></span>' : ''}</button>`;
  }).join('')}</div>`;

  const nav = `<div class="date-nav">
    <button class="icon-btn" data-act="workout-week" data-delta="-7" aria-label="Semaine précédente">${icon('left')}</button>
    <div class="label"><div>${info.started ? `Cycle ${info.cycle} · Semaine ${info.week + 1}` : 'Avant le programme'}</div><div class="tiny muted">${info.started ? WEEKS[info.week].label : 'Démarrage le ' + fmtShort(S().programStart)}</div></div>
    <button class="icon-btn" data-act="workout-week" data-delta="7" aria-label="Semaine suivante">${icon('right')}</button>

  } else {
    const S0 = SESSIONS[sess.id]; const exs = sessionExercises(sess.id, sess.week);
    const future = k > t; const w = getWorkout(k, sess, false);
    let absStarted = false; let n = 0;
    const cards = exs.map(e => {
      const E = EXERCISES[e.exId]; n++;
      const sug = suggestion(e.exId, e.scheme, k); const last = lastPerf(e.exId, k);
      const sets = w?.ex?.[e.exId] || [];
      const top = topReps(e.scheme.r);
      const repsLabel = E.reps || 'Reps';
      let sep = '';
      if (e.abs && !absStarted) { absStarted = true; sep = `<div class="abs-sep"><h2 class="h2">Finisher abdos</h2></div>`; }
      const detId = `d-${k}-${e.exId}`;
      const unitR = E.reps === 'Secondes' ? ' s' : '';
      let lastTxt = '';
      if (last) {
        const kgs = last.sets.map(s => parseNum(s.kg)); const same = kgs.every(v => v === kgs[0]);
        const reps = last.sets.map(s => (s.reps || '?') + unitR);
        const perf = same ? `${kgs[0] != null ? fmtKg(kgs[0]) + ' kg × ' : ''}${reps.join(' · ')}` : last.sets.map((s, j) => `${kgs[j] != null ? fmtKg(kgs[j]) + ' kg × ' : ''}${reps[j]}`).join(' · ');

      }

      let carryKg = sug.kg != null ? fmtKg(sug.kg) : '—';

        <div class="ex-head"><span class="ex-n">${n}</span><div style="min-width:0"><h3 class="h3">${E.name}</h3><p class="muted small">${E.muscles}</p></div></div>
        <div class="ex-meta"><span class="pill">${e.scheme.s} × ${e.scheme.r}${E.reps === 'Secondes' ? ' s' : ''}</span><span class="pill">Repos ${fmtRest(e.rest)}</span>${e.scheme.rir ? `<span class="pill">${e.scheme.rir} rep${e.scheme.rir === '1-2' || +e.scheme.rir > 1 ? 's' : ''} en réserve</span>` : ''}</div>

        ${(lastTxt || sug.text) ? `<p class="ex-last">${lastTxt}${lastTxt && sug.text ? '<br>' : ''}${sug.text ? `<b>${sug.text}</b>` : ''}</p>` : ''}

    const doneSets = w ? sum(Object.values(w.ex).map(a => a.filter(s => s.done).length)) : 0;
    const totalSets = sum(exs.map(e => e.scheme.s));
    // Tonnage = charge × reps (hors assistance des tractions et durée de planche).
    const tonnage = w ? sum(Object.entries(w.ex).filter(([id]) => !EXERCISES[id]?.assist && EXERCISES[id]?.reps !== 'Secondes')
      .flatMap(([, sets]) => sets.filter(s => s.done).map(s => Math.max(0, parseNum(s.kg) || 0) * (parseNum(s.reps) || 0)))) : 0;
    body = `<section class="card">
        <div class="card-head"><div><p class="eyebrow" style="margin:0 0 4px">${cap(fmtDay(k))}</p><h2 class="h2">${S0.name}${S0.abs ? ' + abdos' : ''}</h2></div><span class="chip">≈ ${sessionMinutes(sess.id, sess.week)} min</span></div>

        : `<button class="btn btn-primary btn-block" data-act="workout-finish" data-date="${k}">${icon('check')}Terminer la séance</button>`) : ''}`;
  }

  return `${header('Séance', 'Programme 4 semaines')}
    ${nav}${weekStrip}${dayStrip}${body}
    <section class="card tight">
      <details id="d-prog" ${ui.open.has('d-prog') ? 'open' : ''}><summary class="disclosure"><span>Programme complet</span>${icon('right', 'ic-sm')}</summary>
      <div style="display:grid;gap:16px;margin-top:12px">${ROTATION.map(id => programTable(id)).join('')}

/** Graphique SVG : pesées du jour (points discrets) + moyenne hebdomadaire (ligne). */
function chartHTML(metric) {
  const entries = bodySorted().filter(e => e[metric] != null);
  const unit = metric === 'weight' ? 'kg' : 'cm';
  if (entries.length < 2) {
    ui.chartPts = [];
    return `<div class="chart-empty">${entries.length ? 'Encore une mesure et la courbe apparaît.' : `Ajoute tes ${metric === 'weight' ? 'pesées' : 'mesures de tour de taille'} : la courbe des moyennes hebdomadaires apparaîtra ici.`}</div>`;
  }
  const weeks = weeklyAverages(metric);
  const W = 340, H = 190, L = 40, R = 16, T = 22, B = 26;
  const d0 = entries[0].date; const dN = entries[entries.length - 1].date;
  const span = Math.max(14, diffDays(d0, dN));
  const X = days => L + (days / span) * (W - L - R);
  const vals = entries.map(e => +e[metric]).concat(weeks.map(w => w.avg));
  let step = metric === 'weight' ? 0.5 : 1;
  let lo = Math.min(...vals), hi = Math.max(...vals);
  while ((hi - lo) / step > 4) step *= 2;
  lo = Math.floor((lo - step * 0.25) / step) * step; hi = Math.ceil((hi + step * 0.25) / step) * step;
  if (hi - lo < step * 2) hi = lo + step * 2;
  const Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const ticks = []; for (let v = lo; v <= hi + 1e-9; v += step) ticks.push(+v.toFixed(2));
  const dec = step < 1 ? 1 : 0;
  const pts = weeks.map(w => {
    const dd = diffDays(d0, w.monday) + w.offset;
    return { x: X(clamp(dd, 0, span)), y: Y(w.avg), v: w.avg, label: `Sem. du ${fmtShort(w.monday)}`, n: w.n };
  });
  ui.chartPts = pts.map(p => ({ ...p, text: `${p.label} · <b>${fmt(p.v, 1)} ${unit}</b> · ${p.n} mesure${p.n > 1 ? 's' : ''}` }));
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');

  </div>
  <p class="note">Points : pesées du jour · ligne : moyenne de chaque semaine. Touche le graphique pour lire les valeurs.</p>`;
}

function bindChart() {
  const hit = $('#chart-hit'); if (!hit || !ui.chartPts?.length) return;
  const svg = hit.ownerSVGElement; const tip = $('#chart-tip'); const xh = $('#xhair');
  const show = ev => {
    const r = svg.getBoundingClientRect(); const x = (ev.clientX - r.left) / r.width * 340;
    let best = ui.chartPts[0]; for (const p of ui.chartPts) if (Math.abs(p.x - x) < Math.abs(best.x - x)) best = p;
    xh.setAttribute('x1', best.x); xh.setAttribute('x2', best.x); xh.setAttribute('visibility', 'visible');
    tip.innerHTML = best.text; tip.hidden = false;
    const left = clamp(best.x / 340 * r.width, 80, r.width - 80); tip.style.left = left + 'px';
  };
  const hide = () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); };
  hit.addEventListener('pointerdown', show); hit.addEventListener('pointermove', show);
  hit.addEventListener('pointerleave', hide);
}

function setPath(o, p, v) { const ks = p.split('.'); const last = ks.pop(); ks.reduce((a, k) => a[k] ||= {}, o)[last] = v; }

      <div class="row"><button class="btn btn-ghost" data-act="sheet-close">Fermer</button><button class="btn btn-danger" data-act="photo-del" data-id="${p.id}">${icon('trash', 'ic-sm')}Supprimer</button></div>`);
  },
  'photo-del': async el => {
    if (el.dataset.armed !== '1') { el.dataset.armed = '1'; el.lastChild.textContent = 'Confirmer la suppression'; return; }
    try { await PhotoDB.del(el.dataset.id); } catch (e) { toast('Suppression impossible'); }
    closeSheet(); await loadPhotos(); render(); toast('Photo supprimée');
  },

  'toggle-day': el => {
    const wd = +el.dataset.wd; const set = new Set(S().trainingDays);
    set.has(wd) ? set.delete(wd) : set.add(wd);
    state.settings.trainingDays = [...set].sort(); save(); render();
  },
  'toggle-banners': () => { state.settings.banners = !S().banners; save(); render(); checkBanner(); },
  'program-restart': () => confirmSheet('Recommencer le programme ?', 'La semaine de ton prochain entraînement devient la semaine 1 du cycle 1. Tes charges et séances passées restent enregistrées.', 'Recommencer', () => {
    state.settings.programStart = firstProgramMonday(); save(); ui.workoutDate = null; render(); toast(`Semaine 1 à partir du ${fmtShort(S().programStart)}`);
  }, false),
  'calc-goals': () => {
    const st = S();
    const bmr = 10 * st.weight + 6.25 * st.height - 5 * st.age + 5; // Mifflin-St Jeor (homme)
    const tdee = bmr * st.activity;
    const train = Math.round((tdee + 200) / 50) * 50, rest = Math.round(tdee / 50) * 50;
    const prot = Math.round(st.weight * 1.9 / 5) * 5;
    ui.sheetData = { train, rest, prot };
    openSheet(`<h2 class="h2">Objectifs calculés</h2>
      <p class="fg2">Métabolisme de base ≈ <b>${fmt(bmr)} kcal</b> (formule de Mifflin-St Jeor) × activité ${String(st.activity).replace('.', ',')} = maintenance ≈ <b>${fmt(tdee)} kcal</b>.</p>
      <div class="grid3">
        <div class="kpi"><small>Entraînement</small><b>${fmt(train)}</b><span>maintenance + 200</span></div>
        <div class="kpi"><small>Repos</small><b>${fmt(rest)}</b><span>maintenance</span></div>
        <div class="kpi"><small>Protéines</small><b>${prot} g</b><span>≈ 1,9 g/kg</span></div>
      </div>
      <p class="note">C’est un point de départ : la tendance de ta balance (onglet Suivi) dira s’il faut ajuster.</p>
      <div class="row"><button class="btn btn-ghost" data-act="sheet-close">Annuler</button><button class="btn btn-primary" data-act="apply-goals">Appliquer</button></div>`);
  },
  'apply-goals': () => {
    const g = ui.sheetData; if (!g?.train) return;
    Object.assign(state.settings, { kcalTraining: g.train, kcalRest: g.rest, protein: g.prot });
    save(); closeSheet(); render(); toast('Objectifs mis à jour');
  },
  'notif-ask': async () => {
    if (!('Notification' in window)) { toast('Notifications indisponibles ici. Sur iPhone : installe d’abord l’app sur l’écran d’accueil.'); return; }
    try { const r = await Notification.requestPermission(); toast(r === 'granted' ? 'Notifications autorisées' : 'Notifications non autorisées'); }
    catch (e) { toast('Demande impossible dans ce contexte'); }
    render();
  },
  'export': () => exportData(),
  'import': () => $('#import-input').click(),
  'reset': () => confirmSheet('Tout effacer ?', 'Réglages, repas, séances, mesures et photos seront supprimés de ce téléphone. Exporte une sauvegarde avant si tu veux les garder.', 'Tout effacer', async () => {
    try { localStorage.removeItem(STORAGE_KEY); await PhotoDB.clear(); } catch (e) { /* ignore */ }
    state = freshState(); ensureProgramStart(); save(); await loadPhotos(); ui.workoutDate = null; location.hash = '#today'; render(); toast('Données effacées');
  }),
};

const Changes = {
  'set-field': el => {
    const { date, ex, i, field } = el.dataset; const sess = sessionFor(date); if (!sess) return;
    const w = getWorkout(date, sess, true); w.ex[ex][+i][field] = el.value.trim(); save();
  },
  'steps': el => { const n = parseNum(el.value); const d = day(todayKey()); d.steps = n == null ? 0 : clamp(Math.round(n), 0, 100000); save(); render(); checkBanner(); },
  'setting': el => {
    const { key, kind } = el.dataset; let v = el.value;
    if (kind === 'num') {
      v = parseNum(v);
      if (v == null) { el.value = String(getPath(S(), key)).replace('.', ','); return; }
      if (el.dataset.min) v = clamp(v, +el.dataset.min, +el.dataset.max);
      if (el.tagName === 'INPUT') el.value = String(v).replace('.', ',');
    } else if (kind === 'date') {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
      v = mondayOf(v); el.value = v; ui.workoutDate = null;
    } else if (kind === 'time' && !/^\d{2}:\d{2}$/.test(v)) return;
    setPath(state.settings, key, v); save(); toast('Enregistré'); checkBanner();
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = Actions[el.dataset.act]; if (!fn) return;
  if (el.tagName !== 'A') e.preventDefault();
  unlockAudio();
  fn(el, e);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el) Changes[el.dataset.change]?.(el, e); });
document.addEventListener('toggle', e => { const t = e.target; if (t.tagName === 'DETAILS' && t.id) t.open ? ui.open.add(t.id) : ui.open.delete(t.id); }, true);
document.addEventListener('submit', e => {
  if (e.target.id !== 'extra-form') return;
  e.preventDefault();
  const name = $('#ex-name').value.trim(); const kcal = parseNum($('#ex-kcal').value); const p = parseNum($('#ex-p').value) ?? 0;
  if (!name || kcal == null) { toast('Indique au moins un nom et des calories'); return; }
  const d = day(ui.sheetData.date); d.extras.push({ id: Date.now().toString(36), name: name.slice(0, 60), kcal: Math.round(kcal), p: Math.round(p) });
  save(); closeSheet(); render(); toast('Extra ajouté');
});

$('#photo-input').addEventListener('change', async e => {
  const file = e.target.files?.[0]; e.target.value = ''; if (!file) return;
  try {
    const blob = await compressImage(file);
    await PhotoDB.put({ id: Date.now().toString(36), date: todayKey(), blob });
    await loadPhotos(); render(); toast('Photo enregistrée sur ce téléphone');
  } catch (err) { toast('Impossible d’enregistrer la photo'); }
});

$('#import-input').addEventListener('change', async e => {
  const file = e.target.files?.[0]; e.target.value = ''; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || typeof data !== 'object' || !data.settings) throw new Error('format');
    confirmSheet('Importer cette sauvegarde ?', 'Tes données actuelles seront remplacées (les photos ne sont pas touchées).', 'Importer', () => {
      state = migrate(data); save(); ui.workoutDate = null; render(); toast('Sauvegarde importée');
    }, false);
  } catch (err) { toast('Fichier non reconnu : choisis une sauvegarde Coach Abdos (.json)'); }
});

async function exportData() {
  const json = JSON.stringify(state, null, 2);
  const name = `coach-abdos-${todayKey()}.json`;
  try {
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: 'Sauvegarde Coach Abdos' }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = name;
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('Sauvegarde exportée');
}

/** Redimensionne une photo (1280 px max) et la compresse en JPEG avant stockage. */
async function compressImage(file, max = 1280, quality = 0.82) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', quality));
  } finally { URL.revokeObjectURL(url); }
}

async function loadPhotos() {
  ui.photos.forEach(p => URL.revokeObjectURL(p.url));
  try {
    const all = await PhotoDB.all();
    ui.photos = all.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.id < b.id ? -1 : 1).map(p => ({ id: p.id, date: p.date, url: URL.createObjectURL(p.blob) }));
  } catch (e) { ui.photos = []; }
  ui.photosLoaded = true;
}

/* ==========================================================================
   8. MINUTEUR DE REPOS
   ========================================================================== */

const Timer = { end: 0, total: 0, label: '', int: null, rang: false };
let audioCtx = null; let wakeLock = null;

function unlockAudio() {
  try { audioCtx ||= new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) { /* audio indisponible */ }
}
function beep() {
  if (!audioCtx) return;
  try {
    [0, 0.22].forEach(t0 => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(); const t = audioCtx.currentTime + t0;
      o.frequency.value = 880; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + 0.2);
    });
  } catch (e) { /* ignore */ }
}
async function keepAwake() { try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) { /* refusé */ } }

function startRest(sec, label) {
  Timer.end = Date.now() + sec * 1000; Timer.total = sec; Timer.label = label; Timer.rang = false;
  clearInterval(Timer.int); Timer.int = setInterval(tickTimer, 250);
  keepAwake(); tickTimer(true); document.body.classList.add('has-timer');
}
function stopTimer() { clearInterval(Timer.int); Timer.end = 0; document.body.classList.remove('has-timer'); const el = $('#timer'); el.hidden = true; el.classList.remove('done'); el.innerHTML = ''; }
function tickTimer(fresh = false) {
  const el = $('#timer'); if (!Timer.end) { el.hidden = true; return; }
  const left = Math.max(0, Timer.end - Date.now()); const s = Math.ceil(left / 1000);
  const C = 2 * Math.PI * 20; const off = C * (1 - left / (Timer.total * 1000));
  if (fresh || !el.firstChild) {
    el.innerHTML = `<div class="timer-card" role="timer" aria-live="off">
      <svg class="ring" viewBox="0 0 48 48" aria-hidden="true"><circle class="bg" cx="24" cy="24" r="20"/><circle class="fg" id="ring-fg" cx="24" cy="24" r="20" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="0"/></svg>
      <div style="min-width:0"><b id="timer-left"></b><p id="timer-label"></p></div>
      <button class="btn btn-sm" data-act="timer-add" aria-label="Ajouter 15 secondes">+15 s</button>
      <button class="icon-btn" data-act="timer-skip" aria-label="Arrêter le minuteur">${icon('close')}</button></div>`;
    el.hidden = false; el.classList.remove('done');
  }
  $('#timer-left').textContent = left > 0 ? `${Math.floor(s / 60)}:${pad(s % 60)}` : 'C’est reparti';
  $('#timer-label').textContent = Timer.label;
  $('#ring-fg').setAttribute('stroke-dashoffset', clamp(off, 0, C).toFixed(1));
  if (left <= 0 && !Timer.rang) {
    Timer.rang = true; el.classList.add('done'); beep(); navigator.vibrate?.([180, 90, 180]);
    clearInterval(Timer.int); setTimeout(() => { if (Timer.rang && Timer.end && Date.now() > Timer.end + 5000) stopTimer(); }, 6000);
  }
}

/* ==========================================================================
   9. BANNIÈRES DE RAPPEL (notifications visuelles)
   ========================================================================== */

function computeBanner() {
  const st = S(); if (!st.banners) return null;
  const k = todayKey(); const d = peekDay(k);
  const wake = toMin(st.wakeTime);
  let now = nowMin(); let bed = bedtimeMin();
  if (bed < wake) bed += 1440;               // coucher après minuit
  if (now < wake - 120) now += 1440;          // nuit après minuit
  const snoozed = key => (ui.snooze[key] || 0) > Date.now();

  // 1. Repas à l'heure (jusqu'à 1 h 30 après)
  for (const s of plannedSlots(k)) {
    const t = toMin(s.time); const key = `meal:${k}:${s.slot}`;
    if (!s.done && now >= t && now <= t + 90 && !snoozed(key)) {
      const m = mealMacros(s.mealId);
      return { key, color: 'var(--kcal)', ic: 'meal', title: `C’est l’heure : ${s.label.toLowerCase()}`, text: `${MEALS[s.mealId].name} · ${fmt(m.kcal)} kcal · ${fmt(m.p)} g de protéines`, action: { label: 'Mangé', act: 'meal-toggle', data: { date: k, slot: s.slot } } };
    }
  }
  // 2. Séance dans moins de 30 min
  const sess = sessionFor(k);
  if (sess && !state.workouts[k]?.done) {
    const t = toMin(st.trainingTime); const key = `train:${k}`;
    if (now >= t - 30 && now < t + 10 && !snoozed(key)) return { key, color: 'var(--accent)', ic: 'dumbbell', title: t - now > 0 ? `Séance dans ${t - now} min` : 'C’est l’heure de la séance', text: `${SESSIONS[sess.id].name} · ≈ ${sessionMinutes(sess.id, sess.week)} min`, action: { label: 'Ouvrir', href: '#workout' } };
  }
  // 3. Heure du coucher
  { const key = `bed:${k}`;
    if (now >= bed - 45 && now <= bed + 30 && !snoozed(key)) return { key, color: 'var(--sleep)', ic: 'moon', title: now < bed ? `Au lit dans ${bed - now} min` : 'C’est l’heure de dormir', text: `Coucher à ${fromMin(bed)} pour ${fmtH(st.sleepGoal)} h de sommeil. Écrans en mode nuit.` }; }
  // 4. Eau : en retard d'au moins 2 verres sur le rythme de la journée
  { const end = bed - 60; const key = `water:${k}`;
    if (now > wake + 60 && now < end && !snoozed(key)) {
      const expected = Math.floor(glassesGoal() * (now - wake) / (end - wake));
      if (expected - (d.water || 0) >= 2) return { key, color: 'var(--water)', ic: 'drop', title: 'Pense à boire', text: `${d.water || 0} verre${(d.water || 0) > 1 ? 's' : ''} sur ${glassesGoal()}. À ce stade de la journée, vise ${expected}.`, action: { label: '+1 verre', act: 'water', data: { delta: 1 } }, snoozeMin: 45 };
    } }
  // 5. Pas en fin de journée
  { const key = `steps:${k}`;
    if (now >= toMin('19:00') && now < bed - 60 && (d.steps || 0) < st.stepsGoal * 0.6 && !snoozed(key)) return { key, color: 'var(--steps)', ic: 'steps', title: 'Petite marche ce soir ?', text: `${fmt(d.steps || 0)} pas notés sur ${fmt(st.stepsGoal)}. 20 min de marche ≈ 2 000 pas.`, action: { label: 'Saisir', href: '#reminders' } }; }
  return null;
}

function checkBanner() {
  const b = computeBanner(); const el = $('#banner');
  if (!b) { ui.banner = null; el.hidden = true; el.innerHTML = ''; return; }
  // Repliée automatiquement : elle réapparaît à la prochaine ouverture de l'app.
  if (ui.bannerAuto.has(b.key)) { ui.banner = b; el.hidden = true; return; }
  if (ui.banner?.key === b.key && !el.hidden) {
    ui.banner = b; const t = el.querySelector('b'), p = el.querySelector('p');
    if (t) t.textContent = b.title; if (p) p.textContent = b.text;
    return;
  }
  ui.banner = b;
  const data = b.action?.data ? Object.entries(b.action.data).map(([k, v]) => `data-${k}="${esc(v)}"`).join(' ') : '';
  const act = b.action ? (b.action.href
    ? `<a class="btn btn-sm btn-primary" href="${b.action.href}" ${b.action.act ? `data-act="${b.action.act}"` : ''} ${data} data-banner-close="1">${b.action.label}</a>`
    : `<button class="btn btn-sm btn-primary" data-act="${b.action.act}" ${data}>${b.action.label}</button>`) : '';
  el.innerHTML = `<div class="banner-card" role="alert" style="--c:${b.color}">
    <span class="banner-ic">${icon(b.ic)}</span>
    <div style="min-width:0"><b>${esc(b.title)}</b><p>${esc(b.text)}</p></div>
    <button class="icon-btn" style="width:38px;height:38px" data-act="banner-dismiss" aria-label="Masquer jusqu’à demain">${icon('close', 'ic-sm')}</button>
    <div class="banner-actions">${act}<button class="btn btn-sm btn-ghost" data-act="banner-snooze">Plus tard</button></div>
  </div>`;
  el.hidden = false;
  clearTimeout(ui.bannerT);
  ui.bannerT = setTimeout(() => { if (ui.banner?.key === b.key) { ui.bannerAuto.add(b.key); el.hidden = true; } }, 12000);
  // Notification système si l'app est en arrière-plan et l'autorisation accordée.
  if (document.hidden && !ui.notified.has(b.key) && 'Notification' in window && Notification.permission === 'granted') {
    ui.notified.add(b.key);
    navigator.serviceWorker?.ready.then(r => r.showNotification(b.title, { body: b.text, tag: b.key, icon: 'icons/icon-192.png', badge: 'icons/icon-192.png' })).catch(() => {});
  }
}
Actions['banner-snooze'] = () => { if (!ui.banner) return; ui.snooze[ui.banner.key] = Date.now() + (ui.banner.snoozeMin || 30) * 60000; saveSnooze(); checkBanner(); };
Actions['banner-dismiss'] = () => { if (!ui.banner) return; const e = new Date(); e.setHours(23, 59, 59); ui.snooze[ui.banner.key] = e.getTime(); saveSnooze(); checkBanner(); };
document.addEventListener('click', e => { if (e.target.closest('[data-banner-close]')) { $('#banner').hidden = true; if (ui.banner) { ui.snooze[ui.banner.key] = Date.now() + 30 * 60000; saveSnooze(); } } });

/* ==========================================================================
   10. NAVIGATION & RENDU
   ========================================================================== */

const ROUTES = ['today', 'meals', 'workout', 'progress', 'reminders', 'prefs'];
const TABS = [['today', 'today', 'Aujourd’hui'], ['meals', 'meal', 'Repas'], ['workout', 'dumbbell', 'Séance'], ['progress', 'chart', 'Suivi'], ['reminders', 'bell', 'Rappels']];

function renderTabs() {
  $('#tabs').innerHTML = TABS.map(([r, ic, l]) => `<a class="tab" href="#${r}" ${ui.route === r ? 'aria-current="page"' : ''}><span class="ic-wrap">${icon(ic)}</span>${l}</a>`).join('');
}

function render() {
  const view = $('#view');
  const changed = ui.route !== ui.prevRoute;
  const y = window.scrollY;
  view.innerHTML = (Views[ui.route] || Views.today)();
  view.classList.remove('enter');
  if (changed) { void view.offsetWidth; view.classList.add('enter'); window.scrollTo(0, 0); }
  else window.scrollTo(0, y);
  if (ui.pop) { view.querySelector(`[data-pop="${ui.pop}"]`)?.classList.add('pop'); ui.pop = null; }
  if (ui.route === 'progress') bindChart();
  ui.prevRoute = ui.route;
  renderTabs();
}

function route() {
  const r = location.hash.replace('#', '');
  ui.route = ROUTES.includes(r) ? r : 'today';
  if (ui.route === 'meals' && ui.prevRoute !== 'meals') ui.mealsDate = todayKey();
  if (ui.route === 'workout' && ui.prevRoute !== 'workout') ui.workoutDate = null;
  render();
}

window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { ui.bannerAuto.clear(); if (ui.route === 'today' || ui.route === 'reminders') render(); checkBanner(); if (Timer.end) tickTimer(); } });

/* ==========================================================================
   11. DÉMARRAGE & MODE HORS LIGNE
   ========================================================================== */

ensureProgramStart();
route();
checkBanner();
setInterval(() => { checkBanner(); if (ui.route === 'today' && !$('#sheet-root').classList.contains('open') && !document.activeElement?.matches('input,select')) render(); }, 60000);
loadPhotos().then(() => { if (ui.route === 'progress') render(); });

// Service worker : met l'app en cache pour qu'elle fonctionne sans réseau.
(() => {
  let framed = false; try { framed = window.self !== window.top; } catch (e) { framed = true; }
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !framed) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
