function macrosFor(item, amount) {
  const k = item.isPortion ? amount : amount / 100;
  return { kcal: item.base.kcal * k, p: item.base.p * k, c: item.base.c * k, f: item.base.f * k };
}
function makeEntry(day, meal, name, grams) {
  const item = byName(name);
  return { id: Math.random().toString(36).slice(2), day, meal, name, qty: grams, grams: true, ...macrosFor(item, grams) };
}

// ---------- Format ----------
const nf0 = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 0 });
const kcal = v => nf0.format(Math.round(v));
const g = v => `${Math.round(v)} g`;
const num = (v, d = 1) => new Intl.NumberFormat("fr-FR", { maximumFractionDigits: d }).format(v);
const signed = (v, d = 1) => (v >= 0 ? "+" : "−") + new Intl.NumberFormat("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d }).format(Math.abs(v));
const dur = h => { const m = Math.round(h * 60); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}`; };
const clock = h => { const x = ((h % 24) + 24) % 24; const hh = Math.floor(x), mm = Math.round((x - hh) * 60); return `${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}`; };
const dayNum = ts => new Date(ts).getDate();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- Calculs (mêmes règles que EnergyAnalysis.swift) ----------
function intakeOn(ts) { return entries.filter(e => e.day === ts).reduce((a, e) => ({ kcal: a.kcal + e.kcal, p: a.p + e.p, c: a.c + e.c, f: a.f + e.f }), { kcal: 0, p: 0, c: 0, f: 0 }); }
function analysis() {
  const hist = window.HISTORY.filter(h => h.intake).map(h => {
    const exp = h.basal + h.active + 0.1 * h.intake;
    return { day: h.day, balance: h.intake - exp };
  });
  const last7 = hist.filter(h => h.day >= today0.getTime() - 7 * DAY);
  const avg = last7.length >= 3 ? last7.reduce((a, h) => a + h.balance, 0) / last7.length : null;
  const kgWeek = avg == null ? null : avg * 7 / 7700;
  let verdict = "none";
  if (avg != null) verdict = avg > 150 ? "gain" : avg < -150 ? "loss" : "stable";
  return { hist, last7, avg, kgWeek, verdict, trend: 0.21 };
}

// ---------- Graphiques SVG ----------
function barChart({ data, height = 150, color, zeroLine = false, target = null, stacked = null, labelEvery = 2, unit = "" }) {
  const W = 340, H = height, padL = 34, padR = 6, padT = 8, padB = 20;
  const vals = stacked ? data.map(d => stacked.reduce((s, k) => s + d[k.key], 0)) : data.map(d => d.v);
  let max = Math.max(...vals, target ?? -Infinity, 0), min = Math.min(...vals, 0);
  const niceStep = v => { const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; };
  const step = niceStep((max - min) / 3 || 1);
  max = Math.ceil(max / step) * step; min = Math.floor(min / step) * step;
  const y = v => padT + (max - v) / (max - min) * (H - padT - padB);
  const bw = (W - padL - padR) / data.length;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for (let v = min; v <= max + 1e-9; v += step) {
    s += `<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--sep)" stroke-width="1"/>`;
    s += `<text x="${padL - 5}" y="${y(v) + 3.5}" font-size="9.5" text-anchor="end" fill="var(--muted)">${num(v, 1)}${unit}</text>`;
  }
  data.forEach((d, i) => {
    const x = padL + i * bw + bw * 0.18, w = bw * 0.64;
    if (stacked) {
      let acc = 0;
      stacked.forEach(k => { const v = d[k.key]; s += `<rect x="${x}" y="${y(acc + v)}" width="${w}" height="${Math.max(0, y(acc) - y(acc + v))}" fill="${k.color}"/>`; acc += v; });
      const top = y(acc); s += `<rect x="${x}" y="${top}" width="${w}" height="3" rx="1.5" fill="none"/>`;
    } else if (d.v != null) {
      const y0 = y(0), y1 = y(d.v), c = typeof color === "function" ? color(d.v) : color;
      s += `<rect x="${x}" y="${Math.min(y0, y1)}" width="${w}" height="${Math.max(1, Math.abs(y1 - y0))}" rx="2.5" fill="${c}"/>`;
    }
    if (i % labelEvery === (data.length - 1) % labelEvery) s += `<text x="${x + w / 2}" y="${H - 5}" font-size="9.5" text-anchor="middle" fill="var(--muted)">${d.label}</text>`;
  });
  if (zeroLine) s += `<line x1="${padL}" x2="${W - padR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1"/>`;
  if (target != null) s += `<line x1="${padL}" x2="${W - padR}" y1="${y(target)}" y2="${y(target)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1"/>`;
  return s + "</svg>";
}

function tile(v, u, c) { return `<div class="tile"><div class="v">${v}${u ? `<span>${u}</span>` : ""}</div><div class="c">${c}</div></div>`; }
function macroBar(label, v, target, color) {
  return `<div class="macro"><div class="macro-head"><span>${label}</span><span class="sub tabular">${target ? `${g(v)} / ${g(target)}` : g(v)}</span></div>${target ? `<div class="progress"><i style="width:${Math.min(100, v / target * 100)}%;background:${color}"></i></div>` : ""}</div>`;
}
function cardTitle(icon, text, color) { return `<div class="card-title" style="color:${color}">${I[icon]}<span>${text}</span></div>`; }

function viewFood() {

  const dayLabel = isToday ? "Aujourd'hui" : new Date(d).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  let html = `<h1 class="large">Repas</h1><div class="stack">
    <div class="list">
      <div class="daysel"><button data-act="prevDay" aria-label="Jour précédent">‹</button><b style="text-transform:capitalize">${dayLabel}</b><button data-act="nextDay" aria-label="Jour suivant" ${isToday ? "disabled" : ""}>›</button></div>

    </div>`;
  if (!isToday && !entries.some(e => e.day === d)) html += `<p class="note">Jour d'exemple sans détail des repas. Reviens sur « Aujourd'hui » ou ajoute un aliment.</p>`;
  for (const m of MEALS) {
    const items = entries.filter(e => e.day === d && e.meal === m.id);
    const sum = items.reduce((a, e) => a + e.kcal, 0);
    html += `<div class="group-label"><span class="meal">${I[m.icon]}${m.label}</span><span class="tabular">${kcal(sum)} kcal</span></div><div class="list">`;
    for (const e of items) {
      html += `<div class="item"><div class="grow"><div class="name">${esc(e.name)}</div><div class="meta">${e.grams ? Math.round(e.qty) + " g" : num(e.qty) + " portion(s)"} · P ${Math.round(e.p)} · G ${Math.round(e.c)} · L ${Math.round(e.f)}</div></div><span class="end">${kcal(e.kcal)} kcal</span><button class="del" data-del="${e.id}" aria-label="Supprimer ${esc(e.name)}">✕</button></div>`;
    }
    html += `<button class="item action" data-add="${m.id}">${I.plus}<span>Ajouter un aliment</span></button></div>`;
  }
  return html + `</div>`;
}

function viewSleep() {
  const n = NIGHTS[NIGHTS.length - 1];
  const last7 = NIGHTS.slice(-7), avg = last7.reduce((a, x) => a + x.hours, 0) / 7;
  const beds = last7.map(x => { let m = x.bed * 60 - 18 * 60; if (m < 0) m += 1440; return m; });
  const mean = beds.reduce((a, b) => a + b, 0) / beds.length;
  const spread = Math.sqrt(beds.reduce((a, b) => a + (b - mean) ** 2, 0) / beds.length);
  const stages = [{ key: "deep", color: "var(--indigo)", label: "Profond" }, { key: "core", color: "var(--blue)", label: "Léger" }, { key: "rem", color: "var(--cyan)", label: "Paradoxal" }];
  return `<h1 class="large">Sommeil</h1><div class="stack">
    <section class="card">
      ${cardTitle("moon", "Cette nuit", "var(--indigo)")}
      <div class="big">${dur(n.hours)}</div>
      <div class="small sub">Coucher ${clock(n.bed)} · Réveil ${clock(n.bed + n.hours + n.awake)}</div>
      <div class="tiles">${tile(dur(n.deep), "", "profond")}${tile(dur(n.core), "", "léger")}${tile(dur(n.rem), "", "paradoxal")}${tile(dur(n.awake), "", "éveillé")}</div>
    </section>
    <section class="card">
      ${cardTitle("bars", "14 dernières nuits", "var(--indigo)")}
      <div class="tiles">${tile(dur(avg), "", "moyenne 7 nuits")}${tile("±" + Math.round(spread), "min", "régularité du coucher")}</div>
      ${barChart({ data: NIGHTS.map(x => ({ ...x, label: dayNum(x.day) })), stacked: stages, target: 8, height: 180, unit: " h" })}
      <div class="legend">${stages.map(s => `<span><i style="background:${s.color}"></i>${s.label}</span>`).join("")}<span>┄ 8 h recommandées</span></div>
      <div class="caption">Pour la prise de muscle, vise 7 à 9 h par nuit avec des horaires réguliers : la majorité de l'hormone de croissance est sécrétée en sommeil profond.</div>
    </section>
  </div>`;
}

function recents() {

  for (const e of [...entries].reverse()) { const k = e.name.toLowerCase(); if (seen.has(k)) continue; seen.add(k); out.push(byName(e.name) || { id: "r-" + k, name: e.name, base: { kcal: e.kcal, p: e.p, c: e.c, f: e.f }, isPortion: true, def: 1 }); if (out.length >= 8) break; }
  return out;
}

    </div>`;
  } else if (sheet.view === "scan") {
    nav = `<button class="l" data-sheet="back">‹ Retour</button><div class="t">Scanner</div><span></span>`;
    body = `<div class="wrap stack" style="padding-top:4px">
      <div class="scanbox"><div class="frame"></div><div class="laser"></div></div>
      <p class="note">Dans l'app, la caméra lit le code-barres et récupère le produit sur Open Food Facts. Ici, la caméra n'est pas utilisée : simule un scan avec un vrai produit testé (Nutella 400 g, code 3017620422003).</p>
      <button class="primary" data-sheet="fakescan">Simuler le scan</button>
    </div>`;
  } else if (sheet.view === "manual") {
    nav = `<button class="l" data-sheet="back">‹ Retour</button><div class="t">Saisie manuelle</div><span></span>`;
    const f = (id, l, u) => `<div class="item"><span class="grow">${l}</span><span class="field"><input id="${id}" type="number" inputmode="decimal" min="0" placeholder="0"><span class="sub">${u}</span></span></div>`;
    body = `<div class="wrap stack" style="padding-top:4px">
      <div class="group-label">Aliment ou plat</div>
      <div class="list"><div class="item"><input id="mname" style="flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--fg);outline:none" placeholder="Nom (ex. : Pâtes bolognaise maison)"></div></div>
      <div class="group-label">Pour la portion consommée</div>
      <div class="list">${f("mk", "Calories", "kcal")}${f("mp", "Protéines", "g")}${f("mc", "Glucides", "g")}${f("mf", "Lipides", "g")}</div>
      <p class="note">Seules les calories sont obligatoires.</p>
      <button class="primary" data-sheet="savemanual">Ajouter</button>
    </div>`;
  }
  root.innerHTML = `<div class="sheet-backdrop" data-sheet="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Ajouter un aliment"><div class="sheet-nav">${nav}</div><div class="sheet-body">${body}</div></div>`;
}
function portionRows(m) {
  const r = (l, v) => `<div class="item"><span class="grow">${l}</span><span class="sub end">${v}</span></div>`;
  return r("Calories", kcal(m.kcal) + " kcal") + r("Protéines", g(m.p)) + r("Glucides", g(m.c)) + r("Lipides", g(m.f));
}
function openSheet(meal) { Object.assign(sheet, { open: true, meal, view: "list", query: "", item: null }); renderSheet(); }
function closeSheet() { sheet.open = false; renderSheet(); }
function toast(msg) {
  const r = document.getElementById("toastRoot"); r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => r.innerHTML = "", 1800);
}
function addEntry(name, qty, grams, m) {
  const day = state.logDay;
  entries.push({ id: Math.random().toString(36).slice(2), day, meal: sheet.meal, name, qty, grams, ...m });
  closeSheet(); render(); toast(`${name} ajouté`);
}

// ---------- Événements ----------
document.addEventListener("click", e => {
  const b = e.target.closest("[data-tab],[data-add],[data-del],[data-act],[data-sheet],[data-pick],[data-meal],[data-step]");
  if (!b) return;
  const d = b.dataset;
  if (d.tab) { state.tab = d.tab; render(); window.scrollTo(0, 0); }
  else if (d.add) openSheet(d.add);
  else if (d.del) { entries = entries.filter(x => x.id !== d.del); render(); toast("Supprimé"); }
  else if (d.act === "prevDay") { state.logDay -= DAY; render(); }
  else if (d.act === "nextDay" && state.logDay < today0.getTime()) { state.logDay += DAY; render(); }
  else if (d.meal) { sheet.meal = d.meal; renderSheet(); }
  else if (d.pick) { const it = pickPool.find(x => x.id === d.pick); if (it) { sheet.item = it; sheet.amount = it.def; sheet.view = "portion"; renderSheet(); } }
  else if (d.step) { const st = sheet.item.isPortion ? 0.5 : 10; sheet.amount = Math.max(0, Math.round(((+sheet.amount || 0) + st * +d.step) * 10) / 10); renderSheet(); }
  else if (d.sheet === "close") closeSheet();
  else if (d.sheet === "back") { sheet.view = "list"; renderSheet(); }
  else if (d.sheet === "scan" || d.sheet === "manual") { sheet.view = d.sheet; renderSheet(); }
  else if (d.sheet === "fakescan") { sheet.item = NUTELLA; sheet.amount = NUTELLA.def; sheet.view = "portion"; renderSheet(); toast("Produit trouvé"); }
  else if (d.sheet === "save") { const a = +sheet.amount; if (a > 0) addEntry(sheet.item.name, a, !sheet.item.isPortion, macrosFor(sheet.item, a)); }
  else if (d.sheet === "savemanual") {
    const v = id => parseFloat((document.getElementById(id).value || "0").replace(",", ".")) || 0;
    const name = document.getElementById("mname").value.trim();
    if (!name || v("mk") <= 0) { toast("Indique un nom et les calories"); return; }
    addEntry(name, 1, false, { kcal: v("mk"), p: v("mp"), c: v("mc"), f: v("mf") });
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") {
    sheet.query = e.target.value; const pos = e.target.selectionStart; renderSheet();
    const q = document.getElementById("q"); q.focus(); try { q.setSelectionRange(pos, pos); } catch (_) {}
  } else if (e.target.id === "amt") {
    sheet.amount = parseFloat(e.target.value) || 0;
    document.getElementById("portionMacros").innerHTML = portionRows(macrosFor(sheet.item, sheet.amount));
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheet.open) closeSheet(); });

render();
</script>
