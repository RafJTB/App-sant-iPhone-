/* Layout : app iPhone sur fond blanc (max 430 px). Cartes gris très clair sans ombre, un anneau pour les calories,
   pastilles de statut, barre d'onglets blanche translucide. Thème clair uniquement, comme l'app. */
:root {
  color-scheme: light;
  --bg: #FFFFFF;
  --surface: #F4F6F5;
  --fg: #0E1311;
  --muted: #6E7773;
  --sep: rgba(14, 19, 17, .08);
  --track: rgba(14, 19, 17, .07);
  --accent: #12A06A;
  --orange: #F07F1A;
  --red: #E5484D;
  --blue: #2F7BE0;
  --indigo: #5B57D6;
  --cyan: #2CA8DE;
  --pink: #E23D72;
  --teal: #0E97A6;
  --bar: rgba(255, 255, 255, .9);
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

.app { max-width: 430px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
.wrap { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.preview-note { display: flex; gap: 8px; align-items: center; justify-content: center; font-size: 11.5px; color: var(--muted); padding-block: 10px 2px; }
.preview-note b { color: var(--fg); font-weight: 600; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }

.head { padding-block: 18px 16px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
h1.large { font-size: 34px; font-weight: 800; letter-spacing: -.035em; margin: 2px 0 0; line-height: 1.1; text-wrap: balance; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card-title { display: flex; align-items: center; gap: 9px; font-size: 14.5px; font-weight: 600; color: var(--fg); }
.card-title .ic { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, currentColor 13%, transparent); flex: none; }
.card-title .ic svg { width: 16px; height: 16px; }
.card-title .lbl { color: var(--fg); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.big { font-size: 40px; font-weight: 700; letter-spacing: -.035em; font-variant-numeric: tabular-nums; line-height: 1.05; }
.sub { color: var(--muted); }
.small { font-size: 13.5px; line-height: 1.5; }
.caption { font-size: 12px; color: var(--muted); line-height: 1.45; }
.tabular { font-variant-numeric: tabular-nums; }
.progress { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.progress > i { display: block; height: 100%; border-radius: 3px; }
.macro { display: flex; flex-direction: column; gap: 6px; }
.macro-head { display: flex; justify-content: space-between; font-size: 13px; gap: 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); gap: 10px; }
.tile .v { font-size: 20px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.tile .v span { font-size: 12.5px; font-weight: 500; color: var(--muted); margin-left: 3px; letter-spacing: 0; }
.tile .c { font-size: 12px; color: var(--muted); }
.divider { height: 1px; background: var(--sep); }
.chart { width: 100%; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

.hero { display: grid; grid-template-columns: 124px 1fr; gap: 18px; align-items: center; }
.ring { position: relative; width: 124px; height: 124px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .center b { font-size: 25px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.ring .center span { font-size: 11px; color: var(--muted); }
.kv { display: flex; flex-direction: column; }
.kv .k { font-size: 12px; color: var(--muted); }
.kv .v { font-size: 20px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: color-mix(in srgb, currentColor 12%, transparent); align-self: flex-start; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.projection { font-size: 32px; font-weight: 800; letter-spacing: -.04em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.projection span { font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.compare > div { background: var(--bg); border-radius: 14px; padding: 10px 12px; }
.compare .k { font-size: 11.5px; color: var(--muted); }
.compare .v { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }

.warn { font-size: 13px; color: #B45A07; background: #FFF4E5; border-radius: 14px; padding: 11px 14px; line-height: 1.45; }
.done-row { color: var(--accent); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.link { color: var(--accent); font-weight: 600; padding: 4px 8px; border-radius: 8px; }
.secondary { background: var(--bg); color: var(--teal); font-weight: 600; border-radius: 12px; padding: 12px; width: 100%; display: inline-flex; justify-content: center; gap: 6px; align-items: center; }
.calib { display: flex; flex-direction: column; gap: 6px; }
.calib .row { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.calib .row svg { width: 17px; height: 17px; color: var(--accent); flex: none; }
.weight-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.weight-head .val { font-size: 30px; font-weight: 800; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
.weight-head .delta { font-size: 14px; font-weight: 600; }
.switch { position: relative; width: 51px; height: 31px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 999px; background: rgba(14,19,17,.14); transition: background .2s; pointer-events: none; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.18); transition: transform .2s; }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(20px); }
.switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
.time-input { border: 0; background: var(--bg); border-radius: 9px; padding: 7px 10px; font: inherit; color: var(--fg); font-variant-numeric: tabular-nums; }

/* listes groupées */
.group-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; padding: 6px 4px 0; margin-bottom: -6px; display: flex; justify-content: space-between; gap: 8px; }
.group-label .meal { display: inline-flex; align-items: center; gap: 6px; }
.group-label svg { width: 14px; height: 14px; }
.list { background: var(--surface); border-radius: 18px; overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 50px; position: relative; width: 100%; text-align: left; }
.item + .item::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--sep); }
.item .grow { flex: 1; min-width: 0; }
.item .name { overflow-wrap: anywhere; font-weight: 500; }
.item .meta { font-size: 12px; color: var(--muted); }
.item .end { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 500; }
.item.action { color: var(--accent); font-weight: 600; }
.item .chev { color: var(--muted); opacity: .6; }
.icon-circle { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; flex: none; background: var(--bg); }
.icon-circle svg { width: 19px; height: 19px; }
.del { color: var(--muted); font-size: 13px; padding: 4px 6px; border-radius: 6px; }
.del:hover { color: var(--red); }
.daysel { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; }
.daysel b { font-weight: 600; }
.daysel button { color: var(--accent); width: 36px; height: 36px; border-radius: 10px; font-size: 20px; background: var(--bg); }
.daysel button:disabled { opacity: .35; cursor: default; }

/* barre d'onglets Liquid Glass : capsule flottante translucide, reflet en haut, pastille sur l'onglet actif */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; pointer-events: none;
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
.tabbar-inner { pointer-events: auto; position: relative; max-width: 400px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 5px;
  border-radius: 999px; background: rgba(255, 255, 255, .58);
  -webkit-backdrop-filter: blur(22px) saturate(1.9) brightness(1.04); backdrop-filter: blur(22px) saturate(1.9) brightness(1.04);
  border: 1px solid rgba(255, 255, 255, .75);
  box-shadow: 0 10px 34px rgba(14, 19, 17, .14), 0 2px 6px rgba(14, 19, 17, .06), inset 0 1px 0 rgba(255, 255, 255, .95), inset 0 -1px 1px rgba(14, 19, 17, .05);
  transition: max-width .35s cubic-bezier(.2, .8, .2, 1), padding .35s; }
.tabbar-inner::before { content: ""; position: absolute; inset: 1px 18px auto; height: 45%; border-radius: 999px; pointer-events: none;
  background: linear-gradient(to bottom, rgba(255, 255, 255, .65), rgba(255, 255, 255, 0)); }
.tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0 6px; border-radius: 999px; font-size: 10.5px; font-weight: 600; color: #4E5753; transition: background .25s, color .25s; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--accent); background: rgba(14, 19, 17, .065); }
.tab:active { transform: scale(.94); }
.tabbar.mini .tabbar-inner { max-width: 290px; padding: 4px; }
.tabbar.mini .tab span { display: none; }
.tabbar.mini .tab { padding: 9px 0; }
@media (prefers-reduced-motion: reduce) { .tabbar-inner { transition: none; } }

/* feuille d'ajout */
.sheet-backdrop { position: fixed; inset: 0; background: rgba(14,19,17,.28); z-index: 30; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; top: calc(env(safe-area-inset-top, 0px) + 28px); z-index: 31; max-width: 430px; margin: 0 auto; background: var(--bg); border-radius: 18px 18px 0 0; display: flex; flex-direction: column; overflow: hidden; animation: up .28s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet-nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 14px max(20px, env(safe-area-inset-right, 0px)) 8px max(20px, env(safe-area-inset-left, 0px)); }
.sheet-nav .t { font-weight: 600; text-align: center; }
.sheet-nav .l { color: var(--accent); justify-self: start; font-weight: 500; }
.sheet-body { overflow-y: auto; flex: 1; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 12px; padding: 10px 12px; color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; color: var(--fg); outline: none; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-radius: 11px; padding: 3px; gap: 2px; }
.seg button { font-size: 12.5px; font-weight: 500; padding: 7px 2px; border-radius: 8px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgba(14,19,17,.1); }
.field { display: flex; align-items: center; gap: 8px; }
.field input { width: 96px; text-align: right; border: 0; background: var(--bg); border-radius: 9px; padding: 8px 10px; font: inherit; color: var(--fg); font-variant-numeric: tabular-nums; }
.stepper { display: inline-flex; background: var(--bg); border-radius: 9px; overflow: hidden; }
.stepper button { width: 44px; height: 34px; font-size: 20px; }
.stepper button + button { border-left: 1px solid var(--sep); }
.primary { background: var(--fg); color: var(--bg); font-weight: 600; border-radius: 14px; padding: 15px; width: 100%; }
.primary:disabled { opacity: .45; }
.note { font-size: 12px; color: var(--muted); padding: 0 4px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; z-index: 40; white-space: nowrap; }
.scanbox { aspect-ratio: 4 / 3; max-width: 100%; border-radius: 18px; background: #0d1210; display: grid; place-items: center; position: relative; overflow: hidden; }
.scanbox .frame { width: 70%; height: 38%; border: 3px solid #fff; border-radius: 12px; opacity: .9; }
.scanbox .laser { position: absolute; left: 15%; right: 15%; height: 2px; background: #3ee08f; top: 50%; box-shadow: 0 0 10px #3ee08f; animation: scan 1.6s ease-in-out infinite alternate; }
@keyframes scan { from { transform: translateY(-38px); } to { transform: translateY(38px); } }
@media (prefers-reduced-motion: reduce) { .scanbox .laser { animation: none; } }
</style>

function macrosFor(item, amount) {
  const k = item.isPortion ? amount : amount / 100;

}
function makeEntry(day, meal, name, grams) {

  window.HISTORY = []; window.COMPLETED = new Set(); window.WEIGHTS = [];

    if (intake) window.COMPLETED.add(day);
    if (i % 2 === 0 || i === 1) window.WEIGHTS.push({ day: day + 7.5 * 3600000, kg: 71.65 + (27 - i) * 0.03 + (rnd(i, 4) - .5) * 0.9 });

})();

const g = v => `${Math.round(v)} g`;
const num = (v, d = 1) => new Intl.NumberFormat("fr-FR", { maximumFractionDigits: d }).format(v);
const signed = (v, d = 1) => (v >= 0 ? "+" : "−") + new Intl.NumberFormat("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d }).format(Math.abs(v));

const clock = h => { const x = ((h % 24) + 24) % 24; const hh = Math.floor(x), mm = Math.round((x - hh) * 60); return `${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}`; };
const dayNum = ts => new Date(ts).getDate();

// ---------- Calculs (mêmes règles que EnergyAnalysis.swift) ----------
function intakeOn(ts) { return entries.filter(e => e.day === ts).reduce((a, e) => ({ kcal: a.kcal + e.kcal, p: a.p + e.p, c: a.c + e.c, f: a.f + e.f }), { kcal: 0, p: 0, c: 0, f: 0 }); }
const mean = xs => xs.reduce((a, b) => a + b, 0) / xs.length;
const median = xs => { if (xs.length < 3) return null; const v = [...xs].sort((a, b) => a - b); return v[Math.floor(v.length / 2)]; };
function slopePerDay(pts) {
  if (pts.length < 2) return null;
  const x0 = Math.min(...pts.map(p => p.day)), xs = pts.map(p => (p.day - x0) / DAY), ys = pts.map(p => p.kg);
  const mx = mean(xs), my = mean(ys);
  let num = 0, den = 0; xs.forEach((x, i) => { num += (x - mx) * (ys[i] - my); den += (x - mx) ** 2; });
  return den > 0 ? num / den : null;
}
// Moyenne par jour puis moyenne glissante sur 7 jours (comme WeightTrend.swift)
function smoothed(pts) {
  const byDay = new Map();
  pts.forEach(p => { const k = dayKey(p.day); byDay.set(k, [...(byDay.get(k) || []), p.kg]); });
  const daily = [...byDay.entries()].map(([day, v]) => ({ day, raw: mean(v) })).sort((a, b) => a.day - b.day);
  return daily.map(d => ({ ...d, trend: mean(daily.filter(x => x.day > d.day - 7 * DAY && x.day <= d.day).map(x => x.raw)) }));
}
function analysis() {
  const t0 = today0.getTime();
  const done = h => h.intake && window.COMPLETED.has(h.day);
  // Calibration : apports moyens − pente du poids × 7 700, sur 28 jours
  const win = window.HISTORY.filter(h => h.day >= t0 - 28 * DAY && done(h));
  const wts = window.WEIGHTS.filter(w => w.day >= t0 - 28 * DAY && w.day < t0);
  const span = wts.length ? (Math.max(...wts.map(w => w.day)) - Math.min(...wts.map(w => w.day))) / DAY : 0;
  let cal = null;
  if (win.length >= 14 && wts.length >= 4 && span >= 14) {
    const tdee = mean(win.map(h => h.intake)) - slopePerDay(wts) * 7700;
    cal = { tdee, days: win.length, weighIns: wts.length, watch: mean(win.map(h => h.basal + h.active + 0.1 * h.intake)) };
  }
  const hist = window.HISTORY.filter(h => h.day >= t0 - 14 * DAY && done(h))
    .map(h => ({ day: h.day, balance: h.intake - (cal ? cal.tdee : h.basal + h.active + 0.1 * h.intake) }));
  const last7 = hist.filter(h => h.day >= t0 - 7 * DAY);
  const avg = last7.length >= 3 ? mean(last7.map(h => h.balance)) : null;
  const kgWeek = avg == null ? null : avg * 7 / 7700;
  let verdict = "none";
  if (avg != null) verdict = avg > 150 ? "gain" : avg < -150 ? "loss" : "stable";
  const trend = (slopePerDay(window.WEIGHTS.filter(w => w.day >= t0 - 28 * DAY)) || 0) * 7;
  const target = cal ? cal.tdee + PROFILE.surplus : (AVG_BASE + PROFILE.surplus) / 0.9;
  const typical = median(window.HISTORY.filter(done).map(h => h.intake));
  return { hist, last7, avg, kgWeek, verdict, trend, cal, target, typical, progress: { days: win.length, weighIns: wts.length } };
}

function weightChart(points) {
  const W = 340, H = 150, padL = 34, padR = 8, padT = 10, padB = 20;
  const xs = points.map(p => p.day), all = points.flatMap(p => [p.raw, p.trend]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const lo = Math.floor((Math.min(...all) - .2) * 2) / 2, hi = Math.ceil((Math.max(...all) + .2) * 2) / 2;
  const X = d => padL + (d - x0) / Math.max(1, x1 - x0) * (W - padL - padR);
  const Y = v => padT + (hi - v) / (hi - lo) * (H - padT - padB);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe de poids">`;
  for (let v = lo; v <= hi + 1e-9; v += .5) {
    s += `<line x1="${padL}" x2="${W - padR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--sep)"/>`;
    if (Math.abs(v * 2 - Math.round(v * 2)) < 1e-6 && (hi - lo <= 2 || Number.isInteger(v))) s += `<text x="${padL - 5}" y="${Y(v) + 3.5}" font-size="9.5" text-anchor="end" fill="var(--muted)">${num(v, 1)}</text>`;
  }
  points.forEach(p => { s += `<circle cx="${X(p.day)}" cy="${Y(p.raw)}" r="2.8" fill="var(--muted)" opacity=".45"/>`; });
  s += `<polyline fill="none" stroke="var(--teal)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" points="${points.map(p => `${X(p.day).toFixed(1)},${Y(p.trend).toFixed(1)}`).join(" ")}"/>`;
  const last = points[points.length - 1];
  s += `<circle cx="${X(last.day)}" cy="${Y(last.trend)}" r="4.5" fill="var(--teal)" stroke="var(--surface)" stroke-width="2"/>`;
  [points[0], points[Math.floor(points.length / 2)], last].forEach((p, i) => { s += `<text x="${X(p.day)}" y="${H - 5}" font-size="9.5" text-anchor="${["start", "middle", "end"][i]}" fill="var(--muted)">${new Date(p.day).toLocaleDateString("fr-FR", { day: "numeric", month: "short" })}</text>`; });
  return s + "</svg>";
}

// ---------- Graphiques SVG ----------
function barChart({ data, height = 150, color, zeroLine = false, target = null, stacked = null, labelEvery = 2, unit = "" }) {
  const W = 340, H = height, padL = 34, padR = 6, padT = 8, padB = 20;
  const vals = stacked ? data.map(d => stacked.reduce((s, k) => s + d[k.key], 0)) : data.map(d => d.v);
  let max = Math.max(...vals, target ?? -Infinity, 0), min = Math.min(...vals, 0);
  const niceStep = v => { const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; };
  const step = niceStep((max - min) / 3 || 1);
  max = Math.ceil(max / step) * step; min = Math.floor(min / step) * step;
  const y = v => padT + (max - v) / (max - min) * (H - padT - padB);
  const bw = (W - padL - padR) / data.length;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for (let v = min; v <= max + 1e-9; v += step) {
    s += `<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--sep)" stroke-width="1"/>`;
    s += `<text x="${padL - 5}" y="${y(v) + 3.5}" font-size="9.5" text-anchor="end" fill="var(--muted)">${num(v, 1)}${unit}</text>`;
  }
  data.forEach((d, i) => {
    const x = padL + i * bw + bw * 0.18, w = bw * 0.64;
    if (stacked) {
      let acc = 0;
      stacked.forEach(k => { const v = d[k.key]; s += `<rect x="${x}" y="${y(acc + v)}" width="${w}" height="${Math.max(0, y(acc) - y(acc + v))}" fill="${k.color}"/>`; acc += v; });
      const top = y(acc); s += `<rect x="${x}" y="${top}" width="${w}" height="3" rx="1.5" fill="none"/>`;
    } else if (d.v != null) {
      const y0 = y(0), y1 = y(d.v), c = typeof color === "function" ? color(d.v) : color;
      s += `<rect x="${x}" y="${Math.min(y0, y1)}" width="${w}" height="${Math.max(1, Math.abs(y1 - y0))}" rx="3.5" fill="${c}"/>`;
    }
    if (i % labelEvery === (data.length - 1) % labelEvery) s += `<text x="${x + w / 2}" y="${H - 5}" font-size="9.5" text-anchor="middle" fill="var(--muted)">${d.label}</text>`;
  });
  if (zeroLine) s += `<line x1="${padL}" x2="${W - padR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1"/>`;
  if (target != null) s += `<line x1="${padL}" x2="${W - padR}" y1="${y(target)}" y2="${y(target)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1"/>`;
  return s + "</svg>";
}

  return `<section class="card">
      ${cardTitle("weight", "Poids", "var(--teal)")}
      <div class="weight-head"><span class="val">${num(last.trend, 1)} kg</span>${delta != null ? `<span class="delta" style="color:${delta >= 0 ? "var(--accent)" : "var(--red)"}">${signed(delta, 1)} kg en 7 j</span>` : ""}</div>
      <div class="caption" style="margin-top:-8px">Tendance lissée sur 7 jours · dernière pesée ${num(last.raw, 1)} kg</div>
      ${weightChart(pts)}
      <button class="secondary" data-act="addWeight">＋ Ajouter une pesée</button>
    </section>`;
}

function viewFood() {
  const d = state.logDay, isToday = d === today0.getTime();
  const tot = intakeOn(d);
  const past = window.HISTORY.find(h => h.day === d);
  if (!entries.some(e => e.day === d) && past && past.intake) tot.kcal = past.intake;
  const dayLabel = isToday ? "Aujourd'hui" : new Date(d).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  let html = `${header("Repas")}<div class="stack">
    <div class="list">
      <div class="daysel"><button data-act="prevDay" aria-label="Jour précédent">‹</button><b style="text-transform:capitalize">${dayLabel}</b><button data-act="nextDay" aria-label="Jour suivant" ${isToday ? "disabled" : ""}>›</button></div>
      <div class="item"><div class="tiles" style="width:100%">${tile(kcal(tot.kcal), "kcal", "total")}${tile(Math.round(tot.p), "g", "protéines")}${tile(Math.round(tot.c), "g", "glucides")}${tile(Math.round(tot.f), "g", "lipides")}</div></div>
    </div>`;
  if (!isToday && !entries.some(e => e.day === d)) html += `<p class="note">Jour d'exemple sans détail des repas. Reviens sur « Aujourd'hui » ou ajoute un aliment.</p>`;
  for (const m of MEALS) {
    const items = entries.filter(e => e.day === d && e.meal === m.id);
    const sum = items.reduce((a, e) => a + e.kcal, 0);
    html += `<div class="group-label"><span class="meal">${I[m.icon]}${m.label}</span><span class="tabular">${kcal(sum)} kcal</span></div><div class="list">`;
    for (const e of items) {
      html += `<div class="item"><div class="grow"><div class="name">${esc(e.name)}</div><div class="meta">${e.grams ? Math.round(e.qty) + " g" : num(e.qty) + " portion(s)"} · P ${Math.round(e.p)} · G ${Math.round(e.c)} · L ${Math.round(e.f)}</div></div><span class="end">${kcal(e.kcal)} kcal</span><button class="del" data-del="${e.id}" aria-label="Supprimer ${esc(e.name)}">✕</button></div>`;
    }
    html += `<button class="item action" data-add="${m.id}">${I.plus}<span>Ajouter un aliment</span></button></div>`;
  }
  const isDone = window.COMPLETED.has(d), typical = analysis().typical;
  if (isDone) {
    html += `<div class="list"><div class="item"><span class="grow done-row">${I.check.replace('<svg ', '<svg width="20" height="20" ')}Journée validée</span><button class="link" data-act="reopen">Rouvrir</button></div></div>
      <p class="note">Cette journée compte dans le verdict et la calibration.</p>`;
  } else {
    if (typical && tot.kcal < typical * 0.6) html += `<div class="warn">Seulement ${kcal(tot.kcal)} kcal, contre ${kcal(typical)} d'habitude : il manque peut-être un repas.</div>`;
    html += `<button class="primary" data-act="complete" ${tot.kcal > 0 ? "" : "disabled"}>Journée terminée</button>
      <p class="note">Valide la journée une fois tous tes repas saisis : seules les journées complètes comptent dans le verdict.</p>`;
  }
  return html + `</div>`;
}

function viewSleep() {
  const n = NIGHTS[NIGHTS.length - 1];
  const last7 = NIGHTS.slice(-7), avg = last7.reduce((a, x) => a + x.hours, 0) / 7;
  const beds = last7.map(x => { let m = x.bed * 60 - 18 * 60; if (m < 0) m += 1440; return m; });
  const mean = beds.reduce((a, b) => a + b, 0) / beds.length;
  const spread = Math.sqrt(beds.reduce((a, b) => a + (b - mean) ** 2, 0) / beds.length);
  const stages = [{ key: "deep", color: "var(--indigo)", label: "Profond" }, { key: "core", color: "var(--blue)", label: "Léger" }, { key: "rem", color: "var(--cyan)", label: "Paradoxal" }];
  return `${header("Sommeil")}<div class="stack">
    <section class="card">
      ${cardTitle("moon", "Cette nuit", "var(--indigo)")}
      <div class="big">${dur(n.hours)}</div>
      <div class="small sub">Coucher ${clock(n.bed)} · Réveil ${clock(n.bed + n.hours + n.awake)}</div>
      <div class="tiles">${tile(dur(n.deep), "", "profond")}${tile(dur(n.core), "", "léger")}${tile(dur(n.rem), "", "paradoxal")}${tile(dur(n.awake), "", "éveillé")}</div>
    </section>
    <section class="card">
      ${cardTitle("bars", "14 dernières nuits", "var(--indigo)")}
      <div class="tiles">${tile(dur(avg), "", "moyenne 7 nuits")}${tile("±" + Math.round(spread), "min", "régularité du coucher")}</div>
      ${barChart({ data: NIGHTS.map(x => ({ ...x, label: dayNum(x.day) })), stacked: stages, target: 8, height: 180, unit: " h" })}
      <div class="legend">${stages.map(s => `<span><i style="background:${s.color}"></i>${s.label}</span>`).join("")}<span>┄ 8 h recommandées</span></div>
      <div class="caption">Pour la prise de muscle, vise 7 à 9 h par nuit avec des horaires réguliers : la majorité de l'hormone de croissance est sécrétée en sommeil profond.</div>
    </section>
  </div>`;
}

function viewSport() {
  const week = WORKOUTS.filter(w => w.d > -7);
  const actives = window.HISTORY.slice(-13).map(h => ({ v: h.active, label: dayNum(h.day) })).concat([{ v: TODAY_HEALTH.active, label: dayNum(today0) }]);
  const dateLabel = w => { const d = new Date(today0.getTime() + w.d * DAY); return d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }) + " " + w.h; };
  return `${header("Sport")}<div class="stack">
    <div class="group-label">Aujourd'hui</div>
    <div class="list"><div class="item"><div class="tiles" style="width:100%">${tile(kcal(TODAY_HEALTH.active), "kcal", "active")}${tile(nf0.format(TODAY_HEALTH.steps), "pas", "marche")}${tile(TODAY_HEALTH.exercise, "min", "exercice")}</div></div></div>
    <div class="group-label">7 derniers jours</div>
    <section class="card">
      <div class="tiles">${tile(week.length, "", "séances")}${tile(dur(week.reduce((a, w) => a + w.min, 0) / 60), "", "durée totale")}${tile(kcal(week.reduce((a, w) => a + w.kcal, 0)), "kcal", "séances")}</div>
      ${barChart({ data: actives, color: "var(--pink)", height: 140 })}
      <div class="caption">Énergie active sur 14 jours. Chaque séance augmente ta dépense : pense à manger plus les jours d'entraînement.</div>
    </section>
    <div class="group-label">Séances (30 jours)</div>
    <div class="list">${WORKOUTS.map(w => `<div class="item"><div class="icon-circle" style="color:var(--accent)">${I[w.icon]}</div><div class="grow"><div class="name">${w.name}</div><div class="meta">${dateLabel(w)}</div></div><div style="text-align:right"><div class="end">${dur(w.min / 60)}</div><div class="meta">${w.km ? num(w.km, 2) + " km · " : ""}${kcal(w.kcal)} kcal</div></div></div>`).join("")}</div>
  </div>`;
}

function viewProfile() {
  const row = (l, v) => `<div class="item"><span class="grow">${l}</span><span class="sub end">${v}</span></div>`;
  return `${header("Profil")}<div class="stack">
    <div class="group-label">Moi</div>
    <div class="list">${row("Dernière pesée (Santé)", num(PROFILE.weight) + " kg")}${row("Taille", PROFILE.height + " cm")}${row("Âge", PROFILE.age + " ans")}${row("Sexe", "Homme")}<div class="item action">Importer depuis l'app Santé</div></div>
    <div class="group-label">Objectif prise de poids</div>
    <div class="list">${row("Surplus visé", "+" + PROFILE.surplus + " kcal/j")}${row("Protéines", num(PROFILE.proteinPerKg) + " g/kg")}${row("Objectif protéines", g(PROTEIN_TARGET))}</div>
    <p class="note">Repères courants : +250 à +500 kcal/jour (≈ +0,25 à +0,5 kg/semaine) et 1,6 à 2,2 g de protéines par kg pour une prise de masse surtout musculaire, avec de la musculation.</p>
    <div class="group-label">Rappel</div>
    <div class="list">
      <div class="item"><label class="grow" for="remind">Rappel du soir</label><span class="switch"><input id="remind" type="checkbox" ${state.remind ? "checked" : ""}><i></i></span></div>
      ${state.remind ? `<div class="item"><label class="grow" for="remindAt">Heure</label><input class="time-input" id="remindAt" type="time" value="${state.remindAt}"></div>` : ""}
    </div>
    <p class="note">Une notification si ta journée n'est pas encore validée. Rien n'est envoyé les jours déjà validés.</p>
    <div class="group-label">Si pas d'Apple Watch</div>
    <div class="list">${row("Niveau d'activité", "Actif (3-5 séances/sem.)")}${row("Métabolisme de base", kcal(BMR) + " kcal")}</div>
    <div class="group-label">Comment est calculé le verdict ?</div>
    <div class="list"><div class="item small">Balance = calories mangées − dépense, sur les 7 dernières journées validées. Au début, la dépense vient de Santé (énergie au repos + active + ~10 % pour la digestion). Après 14 journées validées et 4 pesées sur 2 semaines, elle est recalculée à partir de ta balance : apports moyens − variation de poids × 7 700 kcal/kg. C'est plus fiable que la montre.</div></div>
  </div>`;
}

const TABS = [
  { id: "today", label: "Aujourd'hui", icon: "today", view: viewToday },
  { id: "food", label: "Repas", icon: "food", view: viewFood },
  { id: "sleep", label: "Sommeil", icon: "sleep", view: viewSleep },
  { id: "sport", label: "Sport", icon: "sport", view: viewSport },
  { id: "profile", label: "Profil", icon: "profile", view: viewProfile },
];

function render() {
  document.getElementById("screen").innerHTML = TABS.find(t => t.id === state.tab).view();
  document.getElementById("tabbar").innerHTML = TABS.map(t => `<button class="tab" role="tab" aria-selected="${t.id === state.tab}" data-tab="${t.id}">${I[t.icon]}<span>${t.label}</span></button>`).join("");
}

// ---------- Feuille « Ajouter un aliment » ----------
const sheet = { open: false, meal: "lunch", view: "list", query: "", item: null, amount: 0 };
function recents() {
  const seen = new Set(), out = [];
  for (const e of [...entries].reverse()) { const k = e.name.toLowerCase(); if (seen.has(k)) continue; seen.add(k); out.push(byName(e.name) || { id: "r-" + k, name: e.name, base: { kcal: e.kcal, p: e.p, c: e.c, f: e.f }, isPortion: true, def: 1 }); if (out.length >= 8) break; }
  return out;
}
function itemRow(it) {
  return `<button class="item" data-pick="${esc(it.id)}"><div class="grow"><div class="name">${esc(it.name)}</div><div class="meta">${it.isPortion ? kcal(it.base.kcal) + " kcal / portion" : kcal(it.base.kcal) + " kcal / 100 g · P " + num(it.base.p) + " g"}</div></div><span class="chev">›</span></button>`;
}
const NUTELLA = { id: "off-3017620422003", name: "Nutella – Ferrero", base: { kcal: 539, p: 6.3, c: 57.5, f: 30.9 }, isPortion: false, def: 15 };
let pickPool = [];

function renderSheet() {
  const root = document.getElementById("sheetRoot");
  if (!sheet.open) { root.innerHTML = ""; return; }
  const mealLabel = MEALS.find(m => m.id === sheet.meal).label;
  let nav = "", body = "";
  if (sheet.view === "list") {
    const q = sheet.query.trim().toLowerCase();
    const match = it => !q || it.name.toLowerCase().includes(q);
    const rec = recents().filter(match), db = DB.filter(match);
    pickPool = [...rec, ...db, NUTELLA];
    nav = `<button class="l" data-sheet="close">Annuler</button><div class="t">${mealLabel}</div><span></span>`;
    body = `<div class="wrap stack" style="padding-top:4px">
      <div class="search">${I.search}<input id="q" type="search" placeholder="Rechercher un aliment ou une marque" value="${esc(sheet.query)}" autocomplete="off"></div>
      <div class="seg" role="group" aria-label="Repas">${MEALS.map(m => `<button aria-pressed="${m.id === sheet.meal}" data-meal="${m.id}">${m.label.replace("Petit-déjeuner", "P.-déj.")}</button>`).join("")}</div>
      <div class="list">
        <button class="item action" data-sheet="scan"><div class="icon-circle" style="background:var(--fill)">${I.barcode}</div><span class="grow">Scanner un code-barres</span><span class="chev">›</span></button>
        <button class="item action" data-sheet="manual"><div class="icon-circle" style="background:var(--fill)">${I.pencil}</div><span class="grow">Saisie manuelle (étiquette, plat…)</span><span class="chev">›</span></button>
      </div>
      ${q ? `<div class="group-label">Produits du commerce</div><div class="list"><div class="item small sub">Dans l'app, la recherche « ${esc(sheet.query)} » interroge Open Food Facts. Pas disponible dans cet aperçu web.</div></div>` : ""}
      ${rec.length ? `<div class="group-label">Récents</div><div class="list">${rec.map(itemRow).join("")}</div>` : ""}
      <div class="group-label">Aliments courants</div><div class="list">${db.length ? db.map(itemRow).join("") : `<div class="item sub small">Aucun aliment ne correspond.</div>`}</div>
      <p class="note">Valeurs moyennes approximatives. Pour un produit précis, utilise le scan ou la saisie manuelle.</p>
    </div>`;
  } else if (sheet.view === "portion") {
    const it = sheet.item, m = macrosFor(it, sheet.amount || 0);
    nav = `<button class="l" data-sheet="back">‹ Retour</button><div class="t">Portion</div><span></span>`;
    body = `<div class="wrap stack" style="padding-top:4px">
      <div class="group-label">${esc(it.name)}</div>
      <div class="list">
        <div class="item"><span class="grow">${it.isPortion ? "Portions" : "Quantité"}</span><span class="field"><input id="amt" type="number" inputmode="decimal" min="0" value="${sheet.amount}"><span class="sub">${it.isPortion ? "×" : "g"}</span></span></div>
        <div class="item"><span class="grow">Ajuster</span><span class="stepper"><button data-step="-1" aria-label="Moins">−</button><button data-step="1" aria-label="Plus">+</button></span></div>
      </div>
      <div class="group-label">Apport</div>
      <div class="list" id="portionMacros">${portionRows(m)}</div>
      <button class="primary" data-sheet="save">Ajouter à « ${mealLabel} »</button>
    </div>`;
  } else if (sheet.view === "scan") {
    nav = `<button class="l" data-sheet="back">‹ Retour</button><div class="t">Scanner</div><span></span>`;
    body = `<div class="wrap stack" style="padding-top:4px">
      <div class="scanbox"><div class="frame"></div><div class="laser"></div></div>
      <p class="note">Dans l'app, la caméra lit le code-barres et récupère le produit sur Open Food Facts. Ici, la caméra n'est pas utilisée : simule un scan avec un vrai produit testé (Nutella 400 g, code 3017620422003).</p>
      <button class="primary" data-sheet="fakescan">Simuler le scan</button>
    </div>`;
  } else if (sheet.view === "weight") {
    nav = `<button class="l" data-sheet="close">Annuler</button><div class="t">Nouvelle pesée</div><span></span>`;
    body = `<div class="wrap stack" style="padding-top:4px">
      <div class="list">
        <div class="item"><span class="grow">Poids</span><span class="field"><input id="wkg" type="number" inputmode="decimal" step="0.1" min="30" value="${sheet.amount.toFixed(1)}"><span class="sub">kg</span></span></div>
        <div class="item"><span class="grow">Ajuster</span><span class="stepper"><button data-wstep="-1" aria-label="Moins 100 g">−</button><button data-wstep="1" aria-label="Plus 100 g">+</button></span></div>
      </div>
      <p class="note">Dans l'app, la pesée est enregistrée dans Santé. Idéalement le matin, à jeun.</p>
      <button class="primary" data-sheet="saveweight">Enregistrer</button>
    </div>`;
  } else if (sheet.view === "manual") {
    nav = `<button class="l" data-sheet="back">‹ Retour</button><div class="t">Saisie manuelle</div><span></span>`;
    const f = (id, l, u) => `<div class="item"><span class="grow">${l}</span><span class="field"><input id="${id}" type="number" inputmode="decimal" min="0" placeholder="0"><span class="sub">${u}</span></span></div>`;
    body = `<div class="wrap stack" style="padding-top:4px">
      <div class="group-label">Aliment ou plat</div>
      <div class="list"><div class="item"><input id="mname" style="flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--fg);outline:none" placeholder="Nom (ex. : Pâtes bolognaise maison)"></div></div>
      <div class="group-label">Pour la portion consommée</div>
      <div class="list">${f("mk", "Calories", "kcal")}${f("mp", "Protéines", "g")}${f("mc", "Glucides", "g")}${f("mf", "Lipides", "g")}</div>
      <p class="note">Seules les calories sont obligatoires.</p>
      <button class="primary" data-sheet="savemanual">Ajouter</button>
    </div>`;
  }
  root.innerHTML = `<div class="sheet-backdrop" data-sheet="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Ajouter un aliment"><div class="sheet-nav">${nav}</div><div class="sheet-body">${body}</div></div>`;
}
function portionRows(m) {
  const r = (l, v) => `<div class="item"><span class="grow">${l}</span><span class="sub end">${v}</span></div>`;
  return r("Calories", kcal(m.kcal) + " kcal") + r("Protéines", g(m.p)) + r("Glucides", g(m.c)) + r("Lipides", g(m.f));
}
function openSheet(meal) { Object.assign(sheet, { open: true, meal, view: "list", query: "", item: null }); renderSheet(); }
function closeSheet() { sheet.open = false; renderSheet(); }
function toast(msg) {
  const r = document.getElementById("toastRoot"); r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => r.innerHTML = "", 1800);
}
function addEntry(name, qty, grams, m) {
  const day = state.logDay;
  entries.push({ id: Math.random().toString(36).slice(2), day, meal: sheet.meal, name, qty, grams, ...m });
  closeSheet(); render(); toast(`${name} ajouté`);
}

// ---------- Événements ----------
document.addEventListener("click", e => {
  const b = e.target.closest("[data-tab],[data-add],[data-del],[data-act],[data-sheet],[data-pick],[data-meal],[data-step],[data-wstep]");
  if (!b) return;
  const d = b.dataset;
  if (d.tab) { state.tab = d.tab; render(); window.scrollTo(0, 0); }
  else if (d.add) openSheet(d.add);
  else if (d.del) { entries = entries.filter(x => x.id !== d.del); render(); toast("Supprimé"); }
  else if (d.act === "complete") { window.COMPLETED.add(state.logDay); render(); toast("Journée validée"); }
  else if (d.act === "reopen") { window.COMPLETED.delete(state.logDay); render(); toast("Journée rouverte"); }
  else if (d.act === "addWeight") { const w = window.WEIGHTS[window.WEIGHTS.length - 1]; Object.assign(sheet, { open: true, view: "weight", amount: Math.round(w.kg * 10) / 10 }); renderSheet(); }
  else if (d.wstep) { const inp = document.getElementById("wkg"); sheet.amount = Math.round(((parseFloat(inp.value) || sheet.amount) + 0.1 * +d.wstep) * 10) / 10; inp.value = sheet.amount.toFixed(1); }
  else if (d.act === "prevDay") { state.logDay -= DAY; render(); }
  else if (d.act === "nextDay" && state.logDay < today0.getTime()) { state.logDay += DAY; render(); }
  else if (d.meal) { sheet.meal = d.meal; renderSheet(); }
  else if (d.pick) { const it = pickPool.find(x => x.id === d.pick); if (it) { sheet.item = it; sheet.amount = it.def; sheet.view = "portion"; renderSheet(); } }
  else if (d.step) { const st = sheet.item.isPortion ? 0.5 : 10; sheet.amount = Math.max(0, Math.round(((+sheet.amount || 0) + st * +d.step) * 10) / 10); renderSheet(); }
  else if (d.sheet === "close") closeSheet();
  else if (d.sheet === "back") { sheet.view = "list"; renderSheet(); }
  else if (d.sheet === "scan" || d.sheet === "manual") { sheet.view = d.sheet; renderSheet(); }
  else if (d.sheet === "fakescan") { sheet.item = NUTELLA; sheet.amount = NUTELLA.def; sheet.view = "portion"; renderSheet(); toast("Produit trouvé"); }
  else if (d.sheet === "save") { const a = +sheet.amount; if (a > 0) addEntry(sheet.item.name, a, !sheet.item.isPortion, macrosFor(sheet.item, a)); }
  else if (d.sheet === "saveweight") {
    const kg = parseFloat(String(document.getElementById("wkg").value).replace(",", "."));
    if (!(kg >= 30 && kg <= 250)) { toast("Indique un poids entre 30 et 250 kg"); return; }
    window.WEIGHTS.push({ day: Date.now(), kg }); closeSheet(); render(); toast("Pesée enregistrée");
  }
  else if (d.sheet === "savemanual") {
    const v = id => parseFloat((document.getElementById(id).value || "0").replace(",", ".")) || 0;
    const name = document.getElementById("mname").value.trim();
    if (!name || v("mk") <= 0) { toast("Indique un nom et les calories"); return; }
    addEntry(name, 1, false, { kcal: v("mk"), p: v("mp"), c: v("mc"), f: v("mf") });
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") {
    sheet.query = e.target.value; const pos = e.target.selectionStart; renderSheet();
    const q = document.getElementById("q"); q.focus(); try { q.setSelectionRange(pos, pos); } catch (_) {}
  } else if (e.target.id === "amt") {
    sheet.amount = parseFloat(e.target.value) || 0;
    document.getElementById("portionMacros").innerHTML = portionRows(macrosFor(sheet.item, sheet.amount));
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "remind") { state.remind = e.target.checked; render(); toast(state.remind ? `Rappel activé à ${state.remindAt}` : "Rappel désactivé"); }
  else if (e.target.id === "remindAt" && e.target.value) { state.remindAt = e.target.value; toast(`Rappel à ${state.remindAt}`); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheet.open) closeSheet(); });

// iOS 26 : la barre se réduit en faisant défiler vers le bas et revient en remontant
let lastY = 0;
addEventListener("scroll", () => {
  const y = scrollY, bar = document.querySelector(".tabbar");
  if (y > lastY + 6 && y > 80) bar.classList.add("mini");
  else if (y < lastY - 6 || y < 40) bar.classList.remove("mini");
  lastY = y;
}, { passive: true });

render();
</script>
